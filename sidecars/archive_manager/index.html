<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会话管理</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --am-bg: var(--background, #f8fafc);
      --am-card: var(--card, #ffffff);
      --am-sidebar: var(--sidebar, #f1f5f9);
      --am-fg: var(--foreground, #0f172a);
      --am-muted: var(--muted-foreground, #64748b);
      --am-border: var(--card-border, var(--border, #e2e8f0));
      --am-accent: var(--am-user-accent, var(--primary, #6366f1));
      --am-accent-fg: var(--am-user-accent-fg, var(--primary-foreground, #ffffff));
      --am-surface: color-mix(in srgb, var(--am-card) 92%, transparent);
      --am-hover: color-mix(in srgb, var(--am-accent) 10%, transparent);
      --am-selected-bg: color-mix(in srgb, var(--am-accent) 15%, transparent);
      --am-sub-bg: color-mix(in srgb, var(--am-accent) 8%, transparent);
      --am-sub-border: color-mix(in srgb, var(--am-accent) 24%, transparent);
      --am-tag-bg: color-mix(in srgb, var(--am-accent) 14%, transparent);
      --am-subtle-bg: color-mix(in srgb, var(--am-fg) 6%, transparent);
      --am-code-bg: color-mix(in srgb, var(--am-fg) 8%, transparent);
      --am-code-inline-bg: color-mix(in srgb, var(--am-fg) 12%, transparent);
      --am-star: #f59e0b;
      --am-restore-bg: rgba(16, 185, 129, 0.14);
      --am-restore-fg: #10b981;
      --am-restore-border: rgba(16, 185, 129, 0.42);
      --am-archive-bg: rgba(245, 158, 11, 0.14);
      --am-archive-fg: #d97706;
      --am-archive-border: rgba(245, 158, 11, 0.44);
      --am-danger-bg: rgba(239, 68, 68, 0.12);
      --am-danger-fg: #ef4444;
      --am-danger-border: rgba(239, 68, 68, 0.40);
      --am-badge-archived-bg: color-mix(in srgb, var(--am-accent) 16%, transparent);
      --am-badge-archived-fg: #d97706;
      --am-badge-active-bg: rgba(16, 185, 129, 0.16);
      --am-badge-active-fg: #10b981;
      --am-badge-run-bg: rgba(59, 130, 246, 0.16);
      --am-badge-run-fg: #3b82f6;
      --am-badge-trash-fg: var(--am-danger-fg);
      --am-mark-bg: rgba(250, 204, 21, 0.35);
      --am-ease-modern: cubic-bezier(0.16, 1, 0.3, 1);
      --am-font-scale: 1;
      --am-fs-xs: calc(11px * var(--am-font-scale, 1));
      --am-fs-sm: calc(11.5px * var(--am-font-scale, 1));
      --am-fs-md: calc(12px * var(--am-font-scale, 1));
      --am-fs-base: calc(13px * var(--am-font-scale, 1));
      --am-fs-lg: calc(14px * var(--am-font-scale, 1));
    }

    :root[data-theme-accent="blue"] { --am-user-accent: hsl(217 84% 53%); --am-user-accent-fg: #ffffff; }
    :root[data-theme-accent="emerald"] { --am-user-accent: hsl(152 66% 39%); --am-user-accent-fg: #ffffff; }
    :root[data-theme-accent="amber"] { --am-user-accent: hsl(34 88% 46%); --am-user-accent-fg: #ffffff; }
    :root[data-theme-accent="violet"] { --am-user-accent: hsl(262 76% 58%); --am-user-accent-fg: #ffffff; }
    :root[data-theme-accent="cyan"] { --am-user-accent: hsl(191 82% 41%); --am-user-accent-fg: #ffffff; }
    :root[data-theme-accent="rose"] { --am-user-accent: hsl(346 78% 54%); --am-user-accent-fg: #ffffff; }

    :root[data-font-scale="sm"] { --am-font-scale: 0.92; }
    :root[data-font-scale="md"] { --am-font-scale: 1; }
    :root[data-font-scale="lg"] { --am-font-scale: 1.14; }
    :root[data-font-scale="xl"] { --am-font-scale: 1.28; }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--am-bg);
      color: var(--am-fg);
      font-family: var(--font-sans, "Microsoft YaHei UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--am-fs-base);
      line-height: 1.5;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* Top Header */
    .header {
      flex-shrink: 0;
      padding: 10px 12px 8px;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-identity {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Tabs */
    .tabs {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      max-width: 100%;
      padding: 3px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--am-fg) 5%, transparent);
      border: 1px solid color-mix(in srgb, var(--am-border) 68%, transparent);
      overflow-x: auto;
      scrollbar-width: none;
      user-select: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 7px;
      border: 0;
      background: transparent;
      color: var(--am-muted);
      font-size: var(--am-fs-md);
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: color 160ms var(--am-ease-modern), transform 140ms var(--am-ease-modern);
    }
    .tab-btn:hover {
      background: var(--am-hover);
      color: var(--am-fg);
    }
    .tab-btn:active { transform: scale(0.97); }
    .tabs.has-glider .tab-btn:hover {
      background: transparent;
      color: var(--am-fg);
    }
    .tab-btn.active {
      background: var(--am-accent);
      color: var(--am-accent-fg);
      font-weight: 600;
    }
    .tabs.has-glider .tab-btn.active {
      background: transparent;
      color: var(--am-accent);
    }
    .tab-count {
      font-size: var(--am-fs-xs);
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.16);
      font-variant-numeric: tabular-nums;
      transition: background-color 160ms var(--am-ease-modern), color 160ms var(--am-ease-modern);
    }
    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.24);
      color: inherit;
    }
    .tabs.has-glider .tab-btn.active .tab-count {
      background: color-mix(in srgb, var(--am-accent) 14%, transparent);
      color: var(--am-accent);
    }

    /* Search & Filters */
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .search-box {
      flex: 1 1 180px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      padding: 6px 26px 6px 28px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--am-accent); }
    .search-icon {
      position: absolute;
      left: 8px;
      color: var(--am-muted);
      pointer-events: none;
      display: flex;
    }
    .search-clear {
      position: absolute;
      right: 5px;
      border: 0;
      background: transparent;
      color: var(--am-muted);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .search-clear.show { display: inline-block; }

    select.ctrl-select {
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: var(--am-fs-md);
      outline: none;
      max-width: 130px;
      cursor: pointer;
    }
    select.ctrl-select:focus-visible { border-color: var(--am-accent); }
    #languageSelect { flex: 0 0 auto; }
    #languageStatus { color: var(--am-danger-fg); font-size: var(--am-fs-md); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      color: var(--am-fg);
      font-size: var(--am-fs-md);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .btn:hover:not(:disabled) {
      border-color: var(--am-accent);
      color: var(--am-accent);
    }
    .btn-primary {
      background: var(--am-accent);
      border-color: var(--am-accent);
      color: var(--am-accent-fg);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      color: var(--am-accent-fg);
    }
    .btn-sm {
      padding: 3px 7px;
      font-size: var(--am-fs-sm);
    }
    .btn-restore {
      background: var(--am-restore-bg);
      border-color: var(--am-restore-border);
      color: var(--am-restore-fg);
      font-weight: 500;
    }
    .btn-restore:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.24);
      border-color: var(--am-restore-fg);
      color: var(--am-restore-fg);
    }
    .btn-archive {
      background: var(--am-archive-bg);
      border-color: var(--am-archive-border);
      color: var(--am-archive-fg);
      font-weight: 500;
    }
    .btn-archive:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.24);
      border-color: var(--am-archive-fg);
      color: var(--am-archive-fg);
    }
    .btn-danger {
      background: var(--am-danger-bg);
      border-color: var(--am-danger-border);
      color: var(--am-danger-fg);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--am-danger-fg);
      color: var(--am-danger-fg);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Batch & Stale bars */
    .sub-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--am-sub-bg);
      border: 1px solid var(--am-sub-border);
      font-size: 12px;
    }
    .sub-bar.show { display: flex; }
    .sub-bar-left, .sub-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Main Split Body */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .list-pane {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 0 0 14px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .preview-pane {
      display: none;
      flex-direction: column;
      background: var(--am-card);
      border-left: 1px solid var(--am-border);
      min-width: 0;
      min-height: 0;
    }

    @media (min-width: 680px) {
      .list-pane {
        flex: 0 0 280px;
        max-width: 36%;
      }
      .preview-pane {
        display: flex;
        flex: 1;
      }
      .back-btn { display: none !important; }
    }

    @media (max-width: 679px) {
      .main.show-preview .list-pane { display: none; }
      .main.show-preview .preview-pane {
        display: flex;
        flex: 1;
        border-left: none;
      }
    }

    /* Conversation Row (flat full-bleed list item) */
    .conv-card {
      padding: 9px 11px 9px 20px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--am-border) 62%, transparent);
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      transition: background 0.14s ease, box-shadow 0.14s ease;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .conv-card:hover {
      background: color-mix(in srgb, var(--am-accent) 6%, transparent);
    }
    .conv-card.selected {
      background: color-mix(in srgb, var(--am-accent) 14%, var(--am-card));
      box-shadow:
        inset 3.5px 0 0 var(--am-accent),
        inset 0 1px 0 color-mix(in srgb, var(--am-accent) 28%, transparent),
        inset 0 -1px 0 color-mix(in srgb, var(--am-accent) 28%, transparent);
    }
    .conv-card.selected .card-title {
      color: var(--am-accent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .card-top-left {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .card-check {
      margin-top: 3px;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--am-accent);
      display: none;
    }
    .batch-mode .card-check { display: inline-block; }

    .card-title {
      font-weight: 600;
      font-size: var(--am-fs-base);
      line-height: 1.38;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .icon-toggles {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 3px;
      color: var(--am-muted);
      opacity: 0.7;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .icon-btn:hover { transform: scale(1.15); opacity: 1; }
    .icon-btn.starred { color: var(--am-star); opacity: 1; }
    .icon-btn.pinned { color: var(--am-accent); opacity: 1; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: var(--am-fs-xs);
      color: var(--am-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: var(--am-fs-xs);
      font-weight: 500;
    }
    .pill-status {
      background: transparent;
      padding: 0;
      border-radius: 0;
      gap: 5px;
      font-weight: 600;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      flex-shrink: 0;
    }
    .pill-archived { color: var(--am-badge-archived-fg); }
    .pill-active { color: var(--am-badge-active-fg); }
    .pill-run { color: var(--am-badge-run-fg); }
    .pill-trash { color: var(--am-badge-trash-fg); }
    .pill-proj { background: var(--am-subtle-bg); color: var(--am-fg); }
    .pill-tag { background: var(--am-tag-bg); color: var(--am-accent); }

    .run-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      flex-shrink: 0;
      animation: pulseDot 1.3s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .card-snippet {
      font-size: 11.5px;
      color: var(--am-muted);
      background: var(--am-bg);
      padding: 5px 8px;
      border-radius: 6px;
      border-left: 2px solid var(--am-accent);
      word-break: break-word;
    }

    .card-note {
      font-size: 11.5px;
      color: var(--am-muted);
      font-style: italic;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    mark {
      background: var(--am-mark-bg);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Preview Pane */
    .preview-header {
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--am-surface);
    }

    .preview-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-title {
      font-weight: 600;
      font-size: var(--am-fs-lg);
      word-break: break-word;
      flex: 1;
    }

    .title-edit-input {
      flex: 1;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--am-accent);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .data-status {
      flex-shrink: 0;
      max-height: 80px;
      overflow: auto;
      padding: 6px 14px;
      border-bottom: 1px solid var(--am-border);
      color: var(--am-muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .meta-editor {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--am-bg);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      background: var(--am-tag-bg);
      color: var(--am-accent);
    }
    .tag-chip button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 1;
    }

    .inline-input {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
    }
    .inline-input:focus { border-color: var(--am-accent); }

    .messages-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--am-bg);
    }

    .msg-block {
      flex-shrink: 0;
      border: 1px solid var(--am-border);
      border-radius: 10px;
      background: var(--am-card);
      overflow: hidden;
    }
    .msg-block.user { border-left: 3px solid var(--am-accent); }
    .msg-body-wrap {
      position: relative;
    }
    .msg-block.is-collapsed .msg-body {
      max-height: 320px;
      overflow: hidden;
    }
    .msg-fade {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      background: linear-gradient(to bottom, transparent, var(--am-card) 88%);
      pointer-events: none;
    }
    .msg-block.is-collapsed .msg-fade {
      display: block;
    }
    .msg-expand-btn {
      display: block;
      width: 100%;
      padding: 6px 12px;
      border: 0;
      border-top: 1px solid var(--am-border);
      background: color-mix(in srgb, var(--am-fg) 4%, transparent);
      color: var(--am-accent);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s ease;
    }
    .msg-expand-btn:hover {
      background: var(--am-hover);
    }
    .msg-block.is-folded .msg-head {
      border-bottom: 0;
      cursor: pointer;
    }
    .msg-block.is-folded .msg-body-wrap,
    .msg-block.is-folded .msg-expand-btn {
      display: none !important;
    }
    .msg-head {
      padding: 6px 11px;
      background: var(--am-subtle-bg);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--am-fs-sm);
      font-weight: 600;
      color: var(--am-muted);
    }
    .msg-body {
      padding: 10px 12px;
      font-size: var(--am-fs-base);
      line-height: 1.62;
      word-break: break-word;
    }
    .msg-body.raw {
      white-space: pre-wrap;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      font-size: var(--am-fs-md);
    }
    .msg-body pre {
      background: var(--am-code-bg);
      padding: 8px 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      margin: 6px 0;
    }
    .msg-body code {
      background: var(--am-code-inline-bg);
      padding: 1px 4px;
      border-radius: 4px;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      font-size: 12px;
    }

    function detectLocale(language) {
      if (!language) return 'zh-CN';

      if (locale.language === 'ja') return 'ja';

      glider.style?.setProperty?.('--glider-w', `${w}px`);
      glider.style?.setProperty?.('--glider-h', `${h}px`);
      track.classList.add('has-glider');
      if (!glider.classList.contains('is-ready')) {
        void glider.offsetWidth;
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(() => glider.classList.add('is-ready'));
        } else {
          glider.classList.add('is-ready');
        }
      }
    }

    function syncAllGliders() {
      syncGlider($('primaryNav'), $('primaryGlider'), state.surface === 'settings' ? $('settingsBtn') : $('libraryBtn'));
      const tabsEl = $('tabs');
      syncGlider(tabsEl, $('tabsGlider'), tabsEl?.querySelector?.('.tab-btn.active'));
      const fontEl = $('fontScaleControl');
      syncGlider(fontEl, $('fontScaleGlider'), fontEl?.querySelector?.('.seg-btn.is-active'));
    }

    const navGliderObserver = typeof ResizeObserver === 'function'
      ? new ResizeObserver(() => syncAllGliders())
      : null;
    if (navGliderObserver) {
      navGliderObserver.observe($('primaryNav'));
      navGliderObserver.observe($('tabs'));
      navGliderObserver.observe($('fontScaleControl'));
    }

    const VALID_THEME_ACCENTS = new Set(['host', 'blue', 'emerald', 'amber', 'violet', 'cyan', 'rose']);
    const VALID_FONT_SCALES = new Set(['sm', 'md', 'lg', 'xl']);

    function applyAppearance({ themeAccent, fontScale } = state.preferences) {
      const accent = VALID_THEME_ACCENTS.has(themeAccent) ? themeAccent : 'host';
      const scale = VALID_FONT_SCALES.has(fontScale) ? fontScale : 'md';
      const root = document.documentElement;
      if (accent === 'host') root?.removeAttribute?.('data-theme-accent');
      else root?.setAttribute?.('data-theme-accent', accent);
      root?.setAttribute?.('data-font-scale', scale);

      for (const btn of $('themeAccentPicker')?.querySelectorAll?.('[data-accent]') || []) {
        const active = btn.dataset.accent === accent;
        btn.classList?.toggle?.('is-active', active);
        btn.setAttribute?.('aria-pressed', active ? 'true' : 'false');
        const check = btn.querySelector?.('svg');
        if (check) check.hidden = !active;
      }
      for (const btn of $('fontScaleControl')?.querySelectorAll?.('[data-font-scale]') || []) {
        const active = btn.dataset.fontScale === scale;
        btn.classList?.toggle?.('is-active', active);
        btn.setAttribute?.('aria-pressed', active ? 'true' : 'false');
      }
      syncAllGliders();
    }

    function applyLocale(locale) {
      state.locale = locale;
      document.documentElement.lang = locale;
      document.title = t('brand');
      $('languageSelect').value = locale;
      for (const node of document.querySelectorAll('[data-i18n]')) {
        const pending = node.dataset.pendingAction;
        node.textContent = pending ? t('working', t(pending)) : t(node.dataset.i18n);
      }
      for (const node of document.querySelectorAll('[data-i18n-title]')) node.title = t(node.dataset.i18nTitle);
      for (const node of document.querySelectorAll('[data-i18n-placeholder]')) node.placeholder = t(node.dataset.i18nPlaceholder);
      for (const node of document.querySelectorAll('[data-i18n-label]')) node.setAttribute('aria-label', t(node.dataset.i18nLabel));
      for (const option of document.querySelectorAll('#staleDaysSelect option')) option.textContent = t('days', Number(option.value));
      updateBatchBar();
      updateDeleteDialog();
      renderDeleteReport();
      $('pvRawBtn').textContent = t(state.rawMode ? 'formatted' : 'raw');
      updatePreviewArchiveButton();
      updateToastText();
      renderSettings();
      syncAllGliders();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlightText(htmlSafe, q) {
      const trimmed = String(q || '').trim();
      if (!trimmed) return htmlSafe;
      const terms = state.searchMode === 'keywords'
        ? [...new Set(trimmed.split(/\s+/u).filter(Boolean))].sort((a, b) => b.length - a.length)
        : [trimmed];
      if (!terms.length) return htmlSafe;
      const pattern = terms.map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      try {
        const re = new RegExp(`(${pattern})`, 'gi');
        return htmlSafe.replace(/(<[^>]+>)|([^<]+)/g, (_, tag, text) => (
          tag || text.replace(re, '<mark>$1</mark>')
        ));
      } catch {
        return htmlSafe;
      }
    }

    function formatTime(ms, raw) {
      if (!ms) return raw ? raw.slice(0, 10) : t('unknownTime');
      const diffSec = Math.floor((Date.now() - ms) / 1000);
      if (diffSec < 60) return t('justNow');
      for (const [unit, seconds, limit] of [['minute', 60, 3600], ['hour', 3600, 86400], ['day', 86400, 86400 * 14]]) {
        if (diffSec < limit) return getDateFormats().relative.format(-Math.floor(diffSec / seconds), unit);
      }
      return getDateFormats().date.format(ms);
    }

    function getDateFormats() {
      const locale = state.locale;
      if (!dateFormats.has(locale)) {
        const date = { year: 'numeric', month: 'short', day: 'numeric' };
        dateFormats.set(locale, {
          date: new Intl.DateTimeFormat(locale, date),
          timestamp: new Intl.DateTimeFormat(locale, {
            ...date, hour: '2-digit', minute: '2-digit', second: '2-digit',
          }),
          relative: new Intl.RelativeTimeFormat(locale),
        });
      }
      return dateFormats.get(locale);
    }

    function formatTimestamp(raw) {
      if (!raw) return '';
      const ms = typeof raw === 'number' ? raw : Date.parse(raw);
      return Number.isFinite(ms) ? getDateFormats().timestamp.format(ms) : String(raw);
    }

    function updateToastText() {
      if (!toastContent) return;
      $('toastText').textContent = typeof toastContent === 'function' ? toastContent() : t(toastContent);
      const btn = $('toastAction');
      if (btn.dataset.action) btn.textContent = t(btn.dataset.action);
    }

    function hideToast() {
      $('toast').classList.remove('show');
      toastContent = undefined;
      const btn = $('toastAction');
      delete btn.dataset.action;
      btn.onclick = null;
      btn.style.display = 'none';
    }

    function showToast(message, action, actionFn) {
      toastContent = message;
      const btn = $('toastAction');
      btn.disabled = false;
      if (action && actionFn) {
        btn.dataset.action = action;
        btn.style.display = 'inline-block';
        btn.onclick = () => {
          hideToast();
          return actionFn();
        };
      } else {
        delete btn.dataset.action;
        btn.textContent = '';
        btn.style.display = 'none';
        btn.onclick = null;
      }
      updateToastText();
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 5200);
    }

    function renderMarkdown(md, q) {
      const codeBlocks = [];
      let text = String(md || '').replace(/\r\n/g, '\n');
      text = text.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${highlightText(escapeHtml(code.trimEnd()), q)}</code></pre>`);
        return `@@CODEBLOCK_${idx}@@`;
      });

      const lines = text.split('\n');
      const out = [];
      let inList = false;

      for (const line of lines) {
        if (/^@@CODEBLOCK_\d+@@$/.test(line.trim())) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(line.trim());
          continue;
        }
        const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (hMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          const lvl = hMatch[1].length;
          out.push(`<h${lvl}>${formatInline(hMatch[2], q)}</h${lvl}>`);
          continue;
        }
        const bqMatch = line.match(/^>\s?(.*)$/);
        if (bqMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<blockquote>${formatInline(bqMatch[1], q)}</blockquote>`);
          continue;
        }
        const liMatch = line.match(/^\s*[-*+]\s+(.+)$/);
        if (liMatch) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${formatInline(liMatch[1], q)}</li>`);
          continue;
        }
        if (inList) { out.push('</ul>'); inList = false; }
        if (!line.trim()) continue;
        if (/^---+$/.test(line.trim())) {
          out.push('<hr style="border:0;border-top:1px solid var(--am-border);margin:8px 0;"/>');
          continue;
        }
        out.push(`<p>${formatInline(line, q)}</p>`);
      }
      if (inList) out.push('</ul>');

      let html = out.join('\n');
      codeBlocks.forEach((blk, idx) => {
        html = html.replace(`@@CODEBLOCK_${idx}@@`, blk);
      });
      return html;
    }

    function formatInline(raw, q) {
      let s = escapeHtml(raw);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--am-accent);">$1</a>');
      return highlightText(s, q);
    }

    async function apiPost(path, body = {}, locale = state.locale) {
      const res = await window.sidecar.fetch(path, {
        method: 'POST',
        body: JSON.stringify({ ...body, locale }),
      });
      const data = await res.json();
      if (!res.ok || (data.error && !(path === '/api/pick-directory' && data.unavailable))) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function updateBatchBar() {
      const pane = $('listPane');
      pane.classList.toggle('batch-mode', state.batchMode);
      pane.inert = !state.listReady && state.items.length > 0;
      $('batchBar').classList.toggle('show', state.batchMode);
      $('batchToggleBtn').classList.toggle('btn-primary', state.batchMode);
      const count = state.checkedIds.size;
      const canApply = state.listReady && !state.archivePending && !state.deleteBusy;
      const trash = state.tab === 'trash';
      $('batchDeleteBtn').hidden = (!trash && state.tab !== 'archived') || !state.batchMode;
      $('batchDeleteBtn').textContent = t(trash ? 'trashPurge' : 'trashMove');
      $('batchDeleteBtn').disabled = !canApply || count === 0;
      $('batchRestoreBtn').textContent = t(trash ? 'trashRestore' : 'restoreAll');
      $('batchArchiveBtn').hidden = trash;
      $('batchCountText').textContent = t('selected', count);
      $('selectAllBtn').disabled = !canApply || state.items.length === 0;
      $('batchRestoreBtn').disabled = !canApply || count === 0;
      $('batchArchiveBtn').disabled = !canApply || count === 0;
      const staleBtn = $('archiveAllStaleBtn');
      staleBtn.disabled = !canApply || state.tab !== 'stale' || state.staleIds.length === 0;
      if (!staleBtn.dataset.pendingAction) {
        staleBtn.textContent = state.staleIds.length > 0 ? `${t('archiveIdle')} (${number(state.staleIds.length)})` : t('archiveIdle');
      }
    }

    function invalidateList() {
      state.listReady = false;
      cardStats.clear();
      pendingStats.clear();
      visibleStats.clear();
      updateBatchBar();
      return ++listRequestId;
    }

    function showDataStatus(id, text) {
      const status = $(id);
      status.textContent = text;
      status.hidden = !text || (id === 'listWarning' && state.surface !== 'library');
    }

    function listOptions() {
      return {
        grouped: true,
        tab: state.tab,
        query: state.query,
        groupKey: state.groupKey,
        searchMode: state.searchMode,
        pageSize: state.pageSize,
        tag: state.tag,
        sort: state.sort,
        staleDays: state.staleDays,
      };
    }

    async function loadList({ refresh = false, retrySnapshot = true } = {}) {
      const requestId = invalidateList();
      try {
        const data = await apiPost('/api/conversations', {
          ...listOptions(), page: 1, snapshotId: refresh ? null : state.snapshotId,
          searchClientId, searchSequence: requestId, includeMatchingIds: state.tab === 'stale',
        });
        if (requestId !== listRequestId || data.cancelled) return false;
        state.groups = data.groups ?? [];
        state.groupPages.clear();
        state.snapshotId = data.snapshotId ?? null;
        state.staleIds = data.matchingIds ?? (state.tab === 'stale' ? (data.items || []).map(item => item.id) : []);
        state.items = data.items || [];
        showDataStatus('listWarning', (data.warnings || []).join(t('noticeSeparator')));

        for (const key of ['archived', 'active', 'starred', 'stale', 'all', 'trash']) {
          const el = $(`cnt-${key}`);
          if (el) el.textContent = number(data.counts?.[key] ?? 0);
        }
        syncAllGliders();

        const groupOptions = data.groupOptions || [];
        const hasNativeGroups = groupOptions.some((opt) => typeof opt.key === 'string' && opt.key.startsWith('group:'));
        $('groupSelect').hidden = !hasNativeGroups && !state.groupKey;
        fillSelect('groupSelect', 'allGroups', groupOptions, state.groupKey);

        const tagSel = $('tagSelect');
        const curTag = state.tag;
        const allTags = data.allTags || [];
        tagSel.innerHTML = `<option value="" data-i18n="allTags">${escapeHtml(t('allTags'))}</option>`;
        for (const tagValue of allTags) {
          const opt = document.createElement('option');
          opt.value = tagValue;
          opt.textContent = `#${tagValue}`;
          if (tagValue === curTag) opt.selected = true;
          tagSel.appendChild(opt);
        }
        if (curTag && !allTags.includes(curTag)) {
          const fallbackOpt = document.createElement('option');
          fallbackOpt.value = curTag;
          fallbackOpt.textContent = `#${curTag}`;
          fallbackOpt.selected = true;
          tagSel.appendChild(fallbackOpt);
        }
        tagSel.value = curTag;

        let initialGroup;
        if (state.groups.length && !state.query && !state.openedByTab.has(state.tab)) {
          const assigned = state.groups.filter(group => group.key !== 'unassigned');
          const modified = group => group.lastModifiedMs || Date.parse(group.lastModified) || 0;
          const latest = (assigned.length ? assigned : state.groups).reduce((a, b) => modified(b) > modified(a) ? b : a);
          initialGroup = latest.key;
          state.openedByTab.set(state.tab, new Set([initialGroup]));
        }
        state.listReady = true;
        updateBatchBar();
        renderList();
        if (initialGroup && state.surface === 'library') {
          const toggle = workspaceNodes.get(initialGroup)?.toggle;
          if (toggle) scrollWithin($('listPane'), toggle);
        }
        const opened = state.groups.filter(group => groupIsOpen(group.key));
        // Large searches can open many workspaces. Leave capacity for input and preview requests.
        for (let start = 0; start < opened.length && requestId === listRequestId; start += 6) {
          const loaded = await Promise.all(opened.slice(start, start + 6)
            .map(group => loadGroup(group.key, 1, { retrySnapshot })));
          if (loaded.includes('resynced')) return state.listReady;
        }
        return requestId === listRequestId;
      } catch (err) {
        if (requestId !== listRequestId) return false;
        state.items = [];
        state.groups = [];
        state.groupPages.clear();
        resetSelection();
        state.listReady = false;
        showDataStatus('listWarning', '');
        updateBatchBar();
        $('listPane').innerHTML = `<div class="empty-state" role="status">${escapeHtml(t('loadFailed', err.message))}</div>`;
        return false;
      }
    }

    function fillSelect(id, allLabel, options, selected) {
      const select = $(id);
      select.innerHTML = `<option value="" data-i18n="${allLabel}">${escapeHtml(t(allLabel))}</option>`;
      for (const { key, label } of options) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = label;
        select.appendChild(option);
      }
      if (selected && !options.some((opt) => opt.key === selected)) {
        const fallback = document.createElement('option');
        fallback.value = selected;
        fallback.textContent = selected;
        select.appendChild(fallback);
      }
      select.value = selected;
    }

    function selectItem(item, selected) {
      if (selected) {
        state.checkedIds.add(item.id);
        state.selectedTitles.set(item.id, item.title || item.id);
      } else {
        state.checkedIds.delete(item.id);
        state.selectedTitles.delete(item.id);
      }
    }

    function resetSelection() {
      state.checkedIds.clear();
      state.selectedTitles.clear();
      if (state.pendingBatch) closeDeleteModal();
    }

    function resetFilters() {
      resetSelection();
      state.searchOpened.clear();
      state.deleteReport = null;
      renderDeleteReport();
    }

    function groupIsOpen(key) {
      return state.query
        ? state.searchOpened.get(key) !== false
        : Boolean(state.openedByTab.get(state.tab)?.has(key));
    }

    function syncGroupItems() {
      state.items = state.groups.flatMap(({ key }) => groupIsOpen(key) ? state.groupPages.get(key)?.items ?? [] : []);
      for (const item of state.items) {
        if (state.checkedIds.has(item.id)) state.selectedTitles.set(item.id, item.title || item.id);
      }
      updateBatchBar();
    }

    async function loadGroup(key, page = 1, { retrySnapshot = true } = {}) {
      if (!state.listReady || !groupIsOpen(key)) return;
      const requestId = listRequestId;
      const snapshotId = state.snapshotId;
      const request = { page, items: [], loading: true };
      state.groupPages.set(key, request);
      syncGroupItems();
      renderWorkspace(key);
      try {
        const data = await apiPost('/api/conversations', {
          ...listOptions(), projectKey: key, page, snapshotId,
        });
        if (requestId !== listRequestId || state.groupPages.get(key) !== request) return;
        if (data.snapshotId && snapshotId && data.snapshotId !== snapshotId) {
          if (!retrySnapshot) throw new Error(t('refreshHelp'));
          await loadList({ refresh: true, retrySnapshot: false });
          return 'resynced';
        }
        if (data.cancelled) throw new Error(t('refreshHelp'));
        Object.assign(request, { items: data.items ?? [], page: data.page ?? page, total: data.total });
      } catch (err) {
        if (requestId !== listRequestId || state.groupPages.get(key) !== request) return;
        request.error = err.message;
      }
      request.loading = false;
      syncGroupItems();
      renderWorkspace(key);
    }

    function makePager(group, page) {
      const node = document.createElement('nav');
      node.className = 'pager';
      node.setAttribute('aria-label', `${t('pages')} · ${group.label}`);
      const pageCount = Math.max(1, Math.ceil((page.total ?? group.total) / state.pageSize));
      for (const [label, delta] of [['prevPage', -1], ['pageOf', 0], ['nextPage', 1]]) {
        const child = document.createElement(delta ? 'button' : 'span');
        if (delta) {
          child.type = 'button';
          child.className = 'btn btn-sm';
          child.textContent = t(label);
          child.disabled = page.page + delta < 1 || page.page + delta > pageCount;
          child.addEventListener('click', () => {
            workspaceNodes.get(group.key)?.toggle.focus();
            return loadGroup(group.key, page.page + delta);
          });
        } else {
          child.textContent = t(label, page.page, pageCount, page.total ?? group.total);
          child.setAttribute('role', 'status');
        }
        node.appendChild(child);
      }
      return node;
    }

    const workspaceNodes = new Map();
    function renderWorkspace(key) {
      const nodes = workspaceNodes.get(key);
      if (!nodes) return;
      const { group, toggle, content, marker, cards } = nodes;
      for (const card of cards) {
        statsObserver?.unobserve?.(card);
        observedCards.delete(card);
      }
      cards.length = 0;
      const expanded = groupIsOpen(key);
      toggle.setAttribute('aria-expanded', expanded);
      marker.innerHTML = `<svg class="workspace-folder" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${expanded
        ? '<path d="M3 17V7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"/><path d="M3 17l2.8-6a1 1 0 0 1 .9-.6H21a1 1 0 0 1 .9 1.4l-2.7 6a2 2 0 0 1-1.8 1.2H5a2 2 0 0 1-2-2Z"/>'
        : '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>'}</svg>`;
      content.hidden = !expanded;
      content.innerHTML = '';
      if (!expanded) return;
      const page = state.groupPages.get(key);
      if (!page || page.loading || page.error) {
        const status = document.createElement('div');
        status.className = 'data-status';
        status.setAttribute('role', 'status');
        status.textContent = page?.error ? t('loadFailed', page.error) : t('loading');
        content.appendChild(status);
        if (page?.error) {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'btn btn-sm';
          retry.textContent = t('refresh');
          retry.addEventListener('click', () => {
            toggle.focus();
            return loadGroup(key, page.page);
          });
          content.appendChild(retry);
        }
        return;
      }
      for (const item of page.items) cards.push(renderCard(content, item));
      if ((page.total ?? group.total) > state.pageSize) content.appendChild(makePager(group, page));
    }

    function renderList() {
      const pane = $('listPane');
      const focusedKey = [...workspaceNodes].find(([, { toggle }]) => toggle === document.activeElement)?.[0];
      workspaceNodes.clear();
      statsObserver?.disconnect?.();
      observedCards.clear();
      if (!state.groups.length && !state.items.length) {
        const hints = { archived: 'noArchived', starred: 'noStarred', stale: 'noStale', trash: 'noTrash' };
        const hint = state.query ? t('noMatches', state.query) : t(hints[state.tab] ?? 'noSessions', state.staleDays);
        pane.innerHTML = `<div class="empty-state"><div>${escapeHtml(hint)}</div></div>`;
        return;
      }

      pane.innerHTML = '';
      if (!state.groups.length) {
        for (const item of state.items) renderCard(pane, item);
        return;
      }
      for (const [index, group] of state.groups.entries()) {
        const section = document.createElement('section');
        section.className = 'workspace';
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'workspace-toggle';
        const marker = document.createElement('span');
        marker.setAttribute('aria-hidden', 'true');
        const label = document.createElement('span');
        label.className = 'workspace-label';
        label.textContent = group.label;
        const count = document.createElement('span');
        count.className = 'workspace-count';
        count.textContent = number(group.total);
        const content = document.createElement('div');
        content.className = 'workspace-content';
        content.id = `workspace-content-${index}`;
        toggle.setAttribute('aria-controls', content.id);
        toggle.appendChild(marker);
        toggle.appendChild(label);
        toggle.appendChild(count);
        toggle.addEventListener('click', () => {
          if (!state.listReady) return;
          const next = !groupIsOpen(group.key);
          if (state.query) state.searchOpened.set(group.key, next);
          else {
            let open = state.openedByTab.get(state.tab);
            if (!open) { open = new Set(); state.openedByTab.set(state.tab, open); }
            if (next) open.add(group.key);
            else open.delete(group.key);
          }
          if (next && !state.groupPages.get(group.key)?.items.length) {
            const page = state.groupPages.get(group.key);
            if (!page?.loading) return loadGroup(group.key, page?.page);
          }
          syncGroupItems();
          renderWorkspace(group.key);
        });
        section.appendChild(toggle);
        section.appendChild(content);
        pane.appendChild(section);
        workspaceNodes.set(group.key, { group, toggle, content, marker, cards: [] });
        renderWorkspace(group.key);
        if (focusedKey === group.key) toggle.focus();
      }
    }

    function renderCard(pane, item) {
      const card = document.createElement('div');
      card.className = 'conv-card' + (item.id === state.selectedId ? ' selected' : '');
      const trash = state.tab === 'trash';

      const statusBadge = trash
        ? `<span class="pill pill-status pill-trash"><span class="status-dot"></span>${escapeHtml(t('trashTab'))}</span>`
        : item.isRunning
        ? `<span class="pill pill-status pill-run"><span class="run-dot"></span>${escapeHtml(t('running'))}</span>`
        : item.archived
          ? `<span class="pill pill-status pill-archived"><span class="status-dot"></span>${escapeHtml(t('archived'))}</span>`
          : `<span class="pill pill-status pill-active"><span class="status-dot"></span>${escapeHtml(t('active'))}</span>`;

      const tagsHtml = (item.tags || [])
        .map((t) => `<span class="pill pill-tag">#${escapeHtml(t)}</span>`)
        .join('');
      const snippetHtml = item.matchSnippet
        ? `<div class="card-snippet">${highlightText(escapeHtml(item.matchSnippet), state.query)}</div>`
        : '';
      const noteHtml = item.note
        ? `<div class="card-note">📝 ${highlightText(escapeHtml(item.note), state.query)}</div>`
        : '';

      const stepText = Number.isFinite(item.stepCount) ? `<span>·</span><span>${escapeHtml(t('steps', item.stepCount))}</span>` : '';
      const archiveAction = trash || item.archived ? 'restore' : 'archive';
      const archiveHelp = trash ? 'trashRestore' : item.archived ? 'restoreHelp' : item.isRunning ? 'runningHelp' : 'archiveHelp';
      const pinLabel = escapeHtml(t(item.pinned ? 'unpin' : 'pin'));
      const starLabel = escapeHtml(t(item.starred ? 'unstar' : 'star'));

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            <input type="checkbox" class="card-check" aria-label="${escapeHtml(t('selectChat', item.title))}" ${state.checkedIds.has(item.id) ? 'checked' : ''} />
            <button type="button" class="card-title card-title-button">${highlightText(escapeHtml(item.title), state.query)}</button>
          </div>
          <div class="icon-toggles" ${trash ? 'hidden' : ''}>
            <button class="icon-btn js-pin ${item.pinned ? 'pinned' : ''}" title="${pinLabel}" aria-label="${pinLabel}">📌</button>
            <button class="icon-btn js-star ${item.starred ? 'starred' : ''}" title="${starLabel}" aria-label="${starLabel}">${item.starred ? '★' : '☆'}</button>
          </div>
        </div>
        <div class="card-meta">
          ${statusBadge}
          <span>·</span><span class="card-turns">—</span>
          ${stepText}
          <span>·</span><span>${escapeHtml(formatTime(item.lastModifiedMs, item.lastModified))}</span>
          ${item.groupId ? `<span class="pill">${escapeHtml(item.groupId)}</span>` : ''}
        </div>
        <div class="card-storage"></div>
        ${trash ? `<div class="card-trash-info">${escapeHtml(formatTrashInfo(item))}</div>` : ''}
        ${noteHtml}
        ${snippetHtml}
        <div class="card-actions">
          <button class="btn btn-sm js-open" ${trash ? 'hidden' : ''}>${escapeHtml(t('openChat'))}</button>
          <button class="btn btn-sm btn-${archiveAction} js-toggle-archive" title="${escapeHtml(t(archiveHelp))}" ${item.isRunning && !item.archived ? 'disabled' : ''}>${escapeHtml(t(trash ? 'trashRestore' : `${archiveAction}Button`))}</button>
          ${trash ? `<button class="btn btn-sm btn-danger js-purge" ${item.isRunning ? 'disabled' : ''}>${escapeHtml(t('trashPurge'))}</button>` : ''}
        </div>
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      `;

      card.addEventListener('click', () => {
        if (state.batchMode) {
          selectItem(item, !state.checkedIds.has(item.id));
          updateBatchBar();
          card.querySelector('.card-check').checked = state.checkedIds.has(item.id);
          return;
        }
        openPreview(item.id);
      });

      card.querySelector('.card-check').addEventListener('click', (e) => {
        e.stopPropagation();
        selectItem(item, e.target.checked);
        updateBatchBar();
      });

      card.querySelector('.js-pin').addEventListener('click', async (e) => {
        e.stopPropagation();
        await updateNativeAnnotation(item.id, { pinned: !item.pinned }, item.pinned ? 'unpinned' : 'pinned');
      });
      card.querySelector('.js-star').addEventListener('click', async (e) => {
        e.stopPropagation();
        await updateNativeAnnotation(item.id, { starred: !item.starred }, item.starred ? 'unstarred' : 'starred');
      });
      card.querySelector('.js-open').addEventListener('click', (e) => {
        e.stopPropagation();
        openConversationInHost(item.id);
      });
      card.querySelector('.js-toggle-archive').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (trash) await performTrashAction('restore-trash', [item]);
        else await setConversationsArchived([item.id], !item.archived, e.currentTarget);
      });
      card.querySelector('.js-purge')?.addEventListener('click', e => {
        e.stopPropagation();
        confirmTrashAction('purge-trash', [item]);
      });

      pane.appendChild(card);
      observedCards.set(card, { id: item.id });
      paintStats(card, cardStats.get(item.id));
      if (statsObserver && state.surface === 'library' && !cardStats.has(item.id)) statsObserver.observe(card);
      return card;
    }

    function formatTurns(stats) {
      if (!Number.isFinite(stats?.turnCount) || stats.turnStatus === 'unavailable') return '—';
      return t(stats.turnStatus === 'partial' ? 'atLeastTurns' : 'turns', stats.turnCount);
    }

    function formatStorage(stats) {
      const bytes = stats?.sizeBytes;
      const partial = stats?.storageStatus === 'partial' ? ` · ${t('statsPartial')}` : '';
      if (!Number.isFinite(bytes) || !Number.isFinite(stats?.fileCount) || stats.storageStatus === 'unavailable') {
        return { label: `${t('storageLabel')} —${partial}`, title: t('storageScope') };
      }
      const units = [t('bytes'), 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      const size = value.toLocaleString(state.locale, { maximumFractionDigits: 1 });
      return {
        label: `${t('storageLabel')} ${t('files', stats.fileCount)} · ${size} ${units[unit]}${partial}`,
        title: `${number(bytes)} ${t('bytes')} · ${t('storageScope')}${partial}`,
      };
    }

    function paintStats(card, stats) {
      card.querySelector('.card-turns').textContent = formatTurns(stats);
      const storage = card.querySelector('.card-storage');
      const { label, title } = formatStorage(stats);
      storage.textContent = label;
      storage.title = title;
    }

    function queueStats() {
      if (statsQueued || !state.listReady || state.surface !== 'library') return;
      statsQueued = true;
      queueMicrotask(() => {
        statsQueued = false;
        if (!state.listReady || state.surface !== 'library') return;
        const requestId = listRequestId;
        const surfaceId = statsSurfaceId;
        const snapshotId = state.snapshotId;
        const cardIds = new Set([...observedCards.values()].map(card => card.id));
        const ids = [...visibleStats].filter(id => cardIds.has(id) && !cardStats.has(id) && !pendingStats.has(id));
        visibleStats.clear();
        for (let start = 0; start < ids.length; start += 50) {
          const conversationIds = ids.slice(start, start + 50);
          for (const id of conversationIds) pendingStats.add(id);
          apiPost('/api/conversation-stats', { conversationIds, snapshotId }).then(
            data => data.stats ?? {}, () => ({}),
          ).then(stats => {
            if (requestId !== listRequestId || surfaceId !== statsSurfaceId) return;
            for (const id of conversationIds) {
              pendingStats.delete(id);
              cardStats.set(id, stats[id] ?? null);
            }
            for (const [card, { id }] of observedCards) {
              if (conversationIds.includes(id)) paintStats(card, cardStats.get(id));
            }
          });
        }
      });
    }

    function formatTrashInfo(item) {
      const at = value => Number.isFinite(value) ? getDateFormats().timestamp.format(value) : '—';
      return `${t('originalProject')} · ${item.projectLabel ?? item.project ?? '—'} | ${t('trashedAt')} · ${at(item.trashedAt)} | ${t('purgeAt')} · ${at(item.purgeAt)}`;
    }

    function openConversationInHost(convId) {
      if (window.sidecar?.ui?.toggleConversation) {
        window.sidecar.ui.toggleConversation(convId);
        showToast('hostOpened');
      } else {
        showToast('hostUnavailable');
      }
    }

    function applyPreviewPatch(convId, patch) {
      if (state.selectedId === convId) Object.assign(previewOverrides, patch);
      if (state.previewData?.id === convId) {
        Object.assign(state.previewData, patch);
        updatePreviewHeaderState();
      }
    }

    async function updateNativeAnnotation(convId, patch, successMsg) {
      try {
        await apiPost('/api/meta/update', { conversationId: convId, ...patch });
        applyPreviewPatch(convId, patch);
        if (successMsg) showToast(successMsg);
        await loadList();
      } catch (err) {
        showToast(() => t('updateFailed', err.message));
      }
    }

    function setConversationsArchived(ids, archived, triggerBtn, staleDays) {
      if (!ids.length) return;
      return applyArchiveChange({ conversationIds: ids, archived, staleDays }, archived ? 'archive' : 'restore', triggerBtn);
    }

    async function applyArchiveChange(request, verb, triggerBtn) {
      if (state.archivePending || state.deleteBusy) return;
      state.archivePending = true;
      const toastAction = $('toastAction');
      if (toastAction.dataset.action === 'undo') toastAction.disabled = true;
      if (triggerBtn) {
        triggerBtn.dataset.pendingAction = verb;
        triggerBtn.disabled = true;
        triggerBtn.textContent = t('working', t(verb));
      }
      updateBatchBar();
      const requestLocale = state.locale;
      try {
        const { succeeded, unchanged, failed, changes } = await apiPost('/api/set-archived', request);
        for (const id of [...succeeded, ...unchanged]) {
          state.checkedIds.delete(id);
          state.selectedTitles.delete(id);
        }
        const selectedId = state.selectedId;
        const previewChange = changes.find((change) => change.id === selectedId);
        const archiveState = previewChange?.archived ?? (unchanged.includes(selectedId)
          ? (request.undo?.find((change) => change.id === selectedId)?.previousArchived ?? request.archived)
          : undefined);
        if (typeof archiveState === 'boolean') applyPreviewPatch(selectedId, { archived: archiveState });
        void loadList();
        const canUndo = !request.undo && changes.length > 0;
        const summarize = () => {
          const summary = [t('archiveSuccess', t(verb), succeeded.length)];
          if (unchanged.length) summary.push(t('archiveUnchanged', unchanged.length));
          if (failed.length) {
            const reasons = requestLocale === state.locale ? [...new Set(failed.map(({ error }) => error))] : [];
            const details = reasons.slice(0, 3).join(t('reasonSeparator')) + (reasons.length > 3 ? t('moreReasons') : '');
            summary.push(t('archiveFailures', failed.length, details));
          }
          return summary.join(t('summarySeparator'));
        };
        showToast(summarize, canUndo ? 'undo' : null,
          canUndo ? () => applyArchiveChange({ undo: changes }, 'undo') : null);
      } catch (err) {
        showToast(() => t('archiveError', t(verb), err.message));
      } finally {
        state.archivePending = false;
        if (triggerBtn) {
          delete triggerBtn.dataset.pendingAction;
          triggerBtn.textContent = t(triggerBtn.dataset.i18n ?? `${verb}Button`);
          if (triggerBtn === $('pvArchiveToggleBtn')) updatePreviewArchiveButton();
          else triggerBtn.disabled = false;
        }
        updateBatchBar();
      }
    }

    function setPreviewControlsReady(ready) {
      for (const id of ['pvRenameBtn', 'pvTitleInput', 'pvOpenBtn', 'pvArchiveToggleBtn', 'pvExportFileBtn',
        'pvRawBtn', 'pvRevealLogsBtn', 'pvDeleteBtn', 'tagInput', 'noteInput', 'pvCollapseAllBtn', 'pvScrollTopBtn', 'pvScrollBottomBtn']) {
        $(id).disabled = !ready;
      }
      $('pvMetaEditor').style.display = ready ? '' : 'none';
    }

    function closeDeleteModal() {
      state.pendingDeleteId = null;
      state.pendingBatch = null;
      state.pendingDeleteAction = null;
      $('deleteTargets').hidden = true;
      $('deleteModal').classList.remove('show');
      deleteTrigger?.focus();
      deleteTrigger = null;
    }

    async function openPreview(convId, { refreshLocale = false } = {}) {
      if (deletingIds.has(convId)) return;
      const previous = refreshLocale && state.previewData?.id === convId ? state.previewData : null;
      const requestId = ++previewRequestId;
      previewOverrides = {};
      state.selectedId = convId;
      state.previewData = null;
      if (!state.pendingBatch || (state.pendingDeleteId && state.pendingDeleteId !== convId)) closeDeleteModal();
      if (previous && $('pvTitleInput').style.display !== 'none') $('pvRenameBtn').textContent = t('save');
      else exitTitleEdit();
      setPreviewControlsReady(false);
      showDataStatus('pvSource', '');
      if (!refreshLocale) $('mainSplit').classList.add('show-preview');
      $('previewEmpty').style.display = 'none';
      $('previewContent').style.display = 'flex';
      $('pvTitle').textContent = t('loading');
      resetPreviewMatches();
      $('pvMessages').innerHTML = `<div class="empty-state">${escapeHtml(t('loadingMessages'))}</div>`;
      syncCollapseAllBtn();
      for (const [card, { id }] of observedCards) card.classList.toggle('selected', id === convId);

      try {
        const data = await apiPost('/api/preview', { conversationId: convId });
        if (requestId !== previewRequestId) return;
        if (data.id !== convId) throw new Error(t('previewMismatch'));
        const item = state.items.find(item => item.id === convId);
        state.previewData = Object.assign({}, item, data, previewOverrides);
        if (!previous) $('tagInput').value = '';
        if (!previous || $('noteInput').value === (previous.note || '')) $('noteInput').value = data.note || '';
        setPreviewControlsReady(true);
        renderPreview();
      } catch (err) {
        if (requestId !== previewRequestId) return;
        state.previewData = null;
        setPreviewControlsReady(false);
        showDataStatus('pvSource', '');
        exitTitleEdit();
        $('pvTitle').textContent = t('previewFailed');
        $('pvMessages').innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    function exitTitleEdit() {
      $('pvTitle').style.display = '';
      $('pvTitleInput').style.display = 'none';
      $('pvRenameBtn').textContent = t('rename');
    }

    function updatePreviewArchiveButton() {
      const archBtn = $('pvArchiveToggleBtn');
      const d = state.previewData;
      const pending = archBtn.dataset.pendingAction;
      const trash = d && (d.trashedAt != null || state.tab === 'trash');
      const action = trash || d?.archived ? 'restore' : 'archive';
      archBtn.disabled = Boolean(!d || pending || (d.isRunning && !d.archived));
      archBtn.textContent = pending ? t('working', t(pending)) : t(trash ? 'trashRestore' : `${action}Button`);
      archBtn.title = t(trash ? 'trashRestore' : d?.isRunning && !d.archived ? 'runningHelp' : `${action}Help`);
      archBtn.classList.toggle('btn-restore', Boolean(trash || d?.archived));
      archBtn.classList.toggle('btn-archive', !trash && !d?.archived);
    }

    function updatePreviewHeaderState() {
      const d = state.previewData;
      if (!d) return;
      $('pvTitle').textContent = d.title;
      updatePreviewArchiveButton();
      $('pvRawBtn').textContent = t(state.rawMode ? 'formatted' : 'raw');
      const trash = d.trashedAt != null || state.tab === 'trash';
      $('pvDeleteBtn').disabled = Boolean(d.isRunning || state.deleteBusy);
      $('pvDeleteBtn').textContent = t(trash ? 'trashPurge' : 'trashMove');
      for (const id of ['pvRenameBtn', 'pvOpenBtn', 'pvMetaEditor']) $(id).hidden = trash;
      showDataStatus('pvTrashInfo', trash ? formatTrashInfo(d) : '');
      const sourceLabels = {
        transcript_full: 'fullLog',
        transcript: 'compactLog',
        'transcript_full+transcript': 'mergedLog',
        fts: 'indexLog',
        none: 'noSource',
      };
      const pvWarnings = d.warnings || [];
      const showSourceBanner = Boolean(pvWarnings.length) || (Boolean(d.source) && d.source !== 'transcript_full');
      showDataStatus(
        'pvSource',
        showSourceBanner ? [t('source', t(sourceLabels[d.source] ?? 'unknownSource')), ...pvWarnings].join(t('noticeSeparator')) : ''
      );

      $('tagConflictBox').hidden = !d.tagConflict;
      if (d.tagConflict) {
        const display = tags => tags?.join(', ') || t('emptyTags');
        $('tagConflictText').textContent = t('conflictLabels', display(d.tags), display(d.nativeTags));
      }
      const row = $('pvTagsRow');
      const input = $('tagInput');
      row.querySelectorAll('.tag-chip').forEach((n) => n.remove());
      for (const tag of d.tags || []) {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        const label = escapeHtml(t('removeTag', tag));
        chip.innerHTML = `<span>#${escapeHtml(tag)}</span><button type="button" title="${label}" aria-label="${label}">×</button>`;
        chip.querySelector('button').addEventListener('click', async () => {
          const nextTags = (d.tags || []).filter((x) => x !== tag);
          await saveTags(d.id, nextTags);
        });
        row.insertBefore(chip, input);
      }
    }

    function syncCollapseAllBtn() {
      const box = $('pvMessages');
      const allBlocks = box.querySelectorAll('.msg-block');
      const longBlocks = box.querySelectorAll('.msg-block.is-long');
      const btn = $('pvCollapseAllBtn');
      const hasMsgs = allBlocks.length > 0;
      btn.disabled = !hasMsgs;
      $('pvScrollTopBtn').disabled = !hasMsgs;
      $('pvScrollBottomBtn').disabled = !hasMsgs;
      if (!hasMsgs) {
        btn.textContent = t('expandAll');
        btn.title = t('expandAllHelp');
        return;
      }
      if (longBlocks.length > 0) {
        const hasCollapsed = Boolean(box.querySelector('.msg-block.is-collapsed, .msg-block.is-folded'));
        btn.textContent = t(hasCollapsed ? 'expandAll' : 'foldAll');
        btn.title = t(hasCollapsed ? 'expandLongHelp' : 'foldLongHelp');
      } else {
        const hasFolded = Boolean(box.querySelector('.msg-block.is-folded'));
        btn.textContent = t(hasFolded ? 'expandAll' : 'foldAll');
        btn.title = t(hasFolded ? 'expandAllHelp' : 'foldAllHelp');
      }
    }

    function toggleCollapseAllMessages() {
      const box = $('pvMessages');
      const allBlocks = [...box.querySelectorAll('.msg-block')];
      const longBlocks = [...box.querySelectorAll('.msg-block.is-long')];
      if (longBlocks.length > 0) {
        const shouldExpand = Boolean(box.querySelector('.msg-block.is-collapsed, .msg-block.is-folded'));
        for (const blk of allBlocks) blk.classList.remove('is-folded');
        for (const blk of longBlocks) {
          blk.classList.toggle('is-collapsed', !shouldExpand);
          const eb = blk.querySelector('.msg-expand-btn');
          if (eb) eb.textContent = t(shouldExpand ? 'foldMessage' : 'expandMessage');
        }
      } else if (allBlocks.length > 0) {
        const shouldExpand = Boolean(box.querySelector('.msg-block.is-folded'));
        for (const blk of allBlocks) {
          blk.classList.toggle('is-folded', !shouldExpand);
        }
      }
      syncCollapseAllBtn();
    }

    function scrollWithin(container, target, center = false) {
      if (!container.getBoundingClientRect || !target.getBoundingClientRect) return;
      const viewport = container.getBoundingClientRect();
      const item = target.getBoundingClientRect();
      let offset = 0;
      if (center) offset = item.top - viewport.top - (viewport.height - item.height) / 2;
      else if (item.top < viewport.top) offset = item.top - viewport.top;
      else if (item.bottom > viewport.bottom) offset = item.bottom - viewport.bottom;
      if (offset) container.scrollBy?.({ top: offset, behavior: 'smooth' });
    }

    function resetPreviewMatches() {
      const box = $('pvMessages');
      box.querySelectorAll('mark')[state.previewMatchIndex]?.classList.remove('is-current-match');
      state.previewMatchIndex = -1;
      $('pvMatchNav').hidden = true;
      $('pvMatchCount').textContent = '';
    }

    function stepPreviewMatch(direction) {
      if (state.surface !== 'library' || !state.previewData) return false;
      const marks = state.query ? $('pvMessages').querySelectorAll('mark') : [];
      if (!marks.length) {
        resetPreviewMatches();
        return false;
      }
      const previous = state.previewMatchIndex;
      marks[previous]?.classList.remove('is-current-match');
      const index = previous < 0 ? 0 : (previous + direction + marks.length) % marks.length;
      state.previewMatchIndex = index;
      const mark = marks[index];
      const block = mark.closest('.msg-block');
      if (block && (block.classList.contains('is-folded') || block.classList.contains('is-collapsed'))) {
        block.classList.remove('is-folded', 'is-collapsed');
        const button = block.querySelector('.msg-expand-btn');
        if (button) button.textContent = t('foldMessage');
        syncCollapseAllBtn();
      }
      mark.classList.add('is-current-match');
      $('pvMatchNav').hidden = false;
      $('pvMatchCount').textContent = t('matchCount', index + 1, marks.length);
      if ($('pvMessages').getClientRects?.().length !== 0) {
        scrollWithin($('pvMessages'), mark, true);
      }
      return true;
    }

    function renderPreview() {
      const d = state.previewData;
      if (!d) return;
      updatePreviewHeaderState();
      resetPreviewMatches();

      const box = $('pvMessages');
      if (!d.messages || !d.messages.length) {
        box.innerHTML = `<div class="empty-state">${escapeHtml(t('noMessages'))}</div>`;
        syncCollapseAllBtn();
        return;
      }

      box.innerHTML = '';
      for (const m of d.messages) {
        const blk = document.createElement('div');
        blk.className = `msg-block ${m.role}`;
        const roleLabel = t(m.role === 'user' ? 'userRole' : 'assistantRole');
        const tsLabel = formatTimestamp(m.timestamp);
        const bodyHtml = state.rawMode
          ? highlightText(escapeHtml(m.content), state.query)
          : renderMarkdown(m.content, state.query);

        blk.innerHTML = `
          <div class="msg-head">
            <span>${escapeHtml(roleLabel)}</span>
            <span style="font-weight:400;">${escapeHtml(tsLabel)}</span>
          </div>
          <div class="msg-body-wrap">
            <div class="msg-body ${state.rawMode ? 'raw' : ''}">${bodyHtml}</div>
            <div class="msg-fade"></div>
          </div>
          <button type="button" class="msg-expand-btn" style="display:none;">${escapeHtml(t('expandMessage'))}</button>
        `;
        box.appendChild(blk);

        const bodyEl = blk.querySelector('.msg-body');
        const expandBtn = blk.querySelector('.msg-expand-btn');
        if (bodyEl.scrollHeight > MSG_COLLAPSE_THRESHOLD) {
          blk.classList.add('is-long', 'is-collapsed');
          expandBtn.style.display = 'block';
        }
        expandBtn.addEventListener('click', () => {
          const willCollapse = !blk.classList.contains('is-collapsed');
          blk.classList.toggle('is-collapsed', willCollapse);
          expandBtn.textContent = t(willCollapse ? 'expandMessage' : 'foldMessage');
          if (willCollapse && blk.getBoundingClientRect().top < box.getBoundingClientRect().top) {
            blk.scrollIntoView({ block: 'nearest' });
          }
          syncCollapseAllBtn();
        });
        blk.querySelector('.msg-head').addEventListener('click', () => {
          if (blk.classList.contains('is-folded')) {
            blk.classList.remove('is-folded');
            syncCollapseAllBtn();
          }
        });
      }
      box.scrollTop = 0;
      syncCollapseAllBtn();
      stepPreviewMatch(1);
    }

    async function saveTags(convId, tags, tagResolution) {
      try {
        const res = await apiPost('/api/meta/update', { conversationId: convId, tags, tagResolution });
        applyPreviewPatch(convId, { tags: res.meta.tags, nativeTags: res.meta.nativeTags, tagConflict: res.meta.tagConflict });
        await loadList();
      } catch (err) {
        showToast(() => t('tagsFailed', err.message));
        if (state.selectedId === convId) await openPreview(convId, { refreshLocale: true });
        await loadList({ refresh: true });
      }
    }

    async function saveNote(convId, note) {
      try {
        const res = await apiPost('/api/meta/update', { conversationId: convId, note });
        applyPreviewPatch(convId, { note: res.meta.note || '' });
        await loadList();
      } catch (err) {
        showToast(() => t('noteFailed', err.message));
      }
    }

    async function exportConversationToFile(convId) {
      try {
        const res = await apiPost('/api/export', { conversationId: convId, saveToDisk: true });
        showToast(() => t('exported', res.filename), 'revealFile', async () => {
          try {
            await apiPost('/api/reveal-file', { path: res.savedPath, isFile: true });
          } catch (err) {
            showToast(() => t('revealFailed', err.message));
          }
        });
      } catch (err) {
        showToast(() => t('exportFailed', err.message));
      }
