<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会话管理</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --am-bg: var(--background, #f8fafc);
      --am-card: var(--card, #ffffff);
      --am-sidebar: var(--sidebar, #f1f5f9);
      --am-fg: var(--foreground, #0f172a);
      --am-muted: var(--muted-foreground, #64748b);
      --am-border: var(--card-border, var(--border, #e2e8f0));
      --am-accent: var(--primary, #6366f1);
      --am-accent-fg: var(--primary-foreground, #ffffff);
      --am-surface: color-mix(in srgb, var(--am-card) 92%, transparent);
      --am-hover: color-mix(in srgb, var(--am-accent) 10%, transparent);
      --am-selected-bg: color-mix(in srgb, var(--am-accent) 15%, transparent);
      --am-sub-bg: color-mix(in srgb, var(--am-accent) 8%, transparent);
      --am-sub-border: color-mix(in srgb, var(--am-accent) 24%, transparent);
      --am-tag-bg: color-mix(in srgb, var(--am-accent) 14%, transparent);
      --am-subtle-bg: color-mix(in srgb, var(--am-fg) 6%, transparent);
      --am-code-bg: color-mix(in srgb, var(--am-fg) 8%, transparent);
      --am-code-inline-bg: color-mix(in srgb, var(--am-fg) 12%, transparent);
      --am-star: #f59e0b;
      --am-restore-bg: rgba(16, 185, 129, 0.14);
      --am-restore-fg: #10b981;
      --am-restore-border: rgba(16, 185, 129, 0.42);
      --am-archive-bg: rgba(245, 158, 11, 0.14);
      --am-archive-fg: #d97706;
      --am-archive-border: rgba(245, 158, 11, 0.44);
      --am-danger-bg: rgba(239, 68, 68, 0.12);
      --am-danger-fg: #ef4444;
      --am-danger-border: rgba(239, 68, 68, 0.40);
      --am-badge-archived-bg: color-mix(in srgb, var(--am-accent) 16%, transparent);
      --am-badge-archived-fg: var(--am-accent);
      --am-badge-active-bg: rgba(16, 185, 129, 0.16);
      --am-badge-active-fg: #10b981;
      --am-badge-run-bg: rgba(34, 197, 94, 0.20);
      --am-badge-run-fg: #22c55e;
      --am-mark-bg: rgba(250, 204, 21, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--am-bg);
      color: var(--am-fg);
      font-family: var(--font-sans, "Microsoft YaHei UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* Top Header */
    .header {
      flex-shrink: 0;
      padding: 10px 12px 8px;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-identity {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    .api-pill {
      font-size: 10.5px;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    @media (max-width: 315px) {
      .brand .api-pill { display: none; }
    }

    /* Tabs */
    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--am-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .tab-btn:hover {
      background: var(--am-hover);
      color: var(--am-fg);
    }
    .tab-btn.active {
      background: var(--am-accent);
      color: var(--am-accent-fg);
    }
    .tab-count {
      font-size: 11px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.16);
      font-variant-numeric: tabular-nums;
    }
    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.24);
      color: inherit;
    }

    /* Search & Filters */
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .search-box {
      flex: 1 1 180px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      padding: 6px 26px 6px 28px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--am-accent); }
    .search-icon {
      position: absolute;
      left: 8px;
      color: var(--am-muted);
      pointer-events: none;
      display: flex;
    }
    .search-clear {
      position: absolute;
      right: 5px;
      border: 0;
      background: transparent;
      color: var(--am-muted);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .search-clear.show { display: inline-block; }

    select.ctrl-select {
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
      max-width: 130px;
      cursor: pointer;
    }
    select.ctrl-select:focus-visible { border-color: var(--am-accent); }
    #languageSelect { flex: 0 0 auto; padding: 3px 4px; }
    #languageStatus { color: var(--am-danger-fg); font-size: 12px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      color: var(--am-fg);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .btn:hover:not(:disabled) {
      border-color: var(--am-accent);
      color: var(--am-accent);
    }
    .btn-primary {
      background: var(--am-accent);
      border-color: var(--am-accent);
      color: var(--am-accent-fg);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      color: var(--am-accent-fg);
    }
    .btn-sm {
      padding: 3px 7px;
      font-size: 11.5px;
    }
    .btn-restore {
      background: var(--am-restore-bg);
      border-color: var(--am-restore-border);
      color: var(--am-restore-fg);
      font-weight: 500;
    }
    .btn-restore:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.24);
      border-color: var(--am-restore-fg);
      color: var(--am-restore-fg);
    }
    .btn-archive {
      background: var(--am-archive-bg);
      border-color: var(--am-archive-border);
      color: var(--am-archive-fg);
      font-weight: 500;
    }
    .btn-archive:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.24);
      border-color: var(--am-archive-fg);
      color: var(--am-archive-fg);
    }
    .btn-danger {
      background: var(--am-danger-bg);
      border-color: var(--am-danger-border);
      color: var(--am-danger-fg);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--am-danger-fg);
      color: var(--am-danger-fg);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Batch & Stale bars */
    .sub-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--am-sub-bg);
      border: 1px solid var(--am-sub-border);
      font-size: 12px;
    }
    .sub-bar.show { display: flex; }
    .sub-bar-left, .sub-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Main Split Body */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .list-pane {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 10px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preview-pane {
      display: none;
      flex-direction: column;
      background: var(--am-card);
      border-left: 1px solid var(--am-border);
      min-width: 0;
      min-height: 0;
    }

    @media (min-width: 680px) {
      .list-pane {
        flex: 0 0 280px;
        max-width: 36%;
      }
      .preview-pane {
        display: flex;
        flex: 1;
      }
      .back-btn { display: none !important; }
    }

    @media (max-width: 679px) {
      .main.show-preview .list-pane { display: none; }
      .main.show-preview .preview-pane {
        display: flex;
        flex: 1;
        border-left: none;
      }
    }

    /* Conversation Card */
    .conv-card {
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid var(--am-border);
      background: var(--am-surface);
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .conv-card:hover { border-color: var(--am-accent); }
    .conv-card.selected {
      border-color: var(--am-accent);
      box-shadow: 0 0 0 1px var(--am-accent);
      background: var(--am-selected-bg);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .card-top-left {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .card-check {
      margin-top: 3px;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--am-accent);
      display: none;
    }
    .batch-mode .card-check { display: inline-block; }

    .card-title {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.38;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .icon-toggles {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 3px;
      color: var(--am-muted);
      opacity: 0.7;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .icon-btn:hover { transform: scale(1.15); opacity: 1; }
    .icon-btn.starred { color: var(--am-star); opacity: 1; }
    .icon-btn.pinned { color: var(--am-accent); opacity: 1; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--am-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }
    .pill-archived { background: var(--am-badge-archived-bg); color: var(--am-badge-archived-fg); }
    .pill-active { background: var(--am-badge-active-bg); color: var(--am-badge-active-fg); }
    .pill-run { background: var(--am-badge-run-bg); color: var(--am-badge-run-fg); }
    .pill-proj { background: var(--am-subtle-bg); color: var(--am-fg); }
    .pill-tag { background: var(--am-tag-bg); color: var(--am-accent); }

    .run-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      animation: pulseDot 1.3s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .card-snippet {
      font-size: 11.5px;
      color: var(--am-muted);
      background: var(--am-bg);
      padding: 5px 8px;
      border-radius: 6px;
      border-left: 2px solid var(--am-accent);
      word-break: break-word;
    }

    .card-note {
      font-size: 11.5px;
      color: var(--am-muted);
      font-style: italic;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    mark {
      background: var(--am-mark-bg);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Preview Pane */
    .preview-header {
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--am-surface);
    }

    .preview-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-title {
      font-weight: 600;
      font-size: 14px;
      word-break: break-word;
      flex: 1;
    }

    .title-edit-input {
      flex: 1;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--am-accent);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .data-status {
      flex-shrink: 0;
      max-height: 80px;
      overflow: auto;
      padding: 6px 14px;
      border-bottom: 1px solid var(--am-border);
      color: var(--am-muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .meta-editor {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--am-bg);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      background: var(--am-tag-bg);
      color: var(--am-accent);
    }
    .tag-chip button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 1;
    }

    .inline-input {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
    }
    .inline-input:focus { border-color: var(--am-accent); }

    .messages-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--am-bg);
    }

    .msg-block {
      flex-shrink: 0;
      border: 1px solid var(--am-border);
      border-radius: 10px;
      background: var(--am-card);
      overflow: hidden;
    }
    .msg-block.user { border-left: 3px solid var(--am-accent); }
    .msg-body-wrap {
      position: relative;
    }
    .msg-block.is-collapsed .msg-body {
      max-height: 320px;
      overflow: hidden;
    }
    .msg-fade {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      background: linear-gradient(to bottom, transparent, var(--am-card) 88%);
      pointer-events: none;
    }
    .msg-block.is-collapsed .msg-fade {
      display: block;
    }
    .msg-expand-btn {
      display: block;
      width: 100%;
      padding: 6px 12px;
      border: 0;
      border-top: 1px solid var(--am-border);
      background: color-mix(in srgb, var(--am-fg) 4%, transparent);
      color: var(--am-accent);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s ease;
    }
    .msg-expand-btn:hover {
      background: var(--am-hover);
    }
    .msg-block.is-folded .msg-head {
      border-bottom: 0;
      cursor: pointer;
    }
    .msg-block.is-folded .msg-body-wrap,
    .msg-block.is-folded .msg-expand-btn {
      display: none !important;
    }
    .msg-head {
      padding: 6px 11px;
      background: var(--am-subtle-bg);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--am-muted);
    }
    .msg-body {
      padding: 10px 12px;
      font-size: 12.8px;
      line-height: 1.62;
      word-break: break-word;
    }
    .msg-body.raw {
      white-space: pre-wrap;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      font-size: 12px;
    }
    .msg-body pre {
      background: var(--am-code-bg);
      padding: 8px 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      margin: 6px 0;
    }
    .msg-body code {
      background: var(--am-code-inline-bg);
      padding: 1px 4px;
      border-radius: 4px;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      font-size: 12px;
    }
    .msg-body pre code { background: transparent; padding: 0; }
    .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 { margin: 8px 0 4px; font-size: 13.5px; }
    .msg-body p { margin: 5px 0; }
    .msg-body ul, .msg-body ol { margin: 4px 0; padding-left: 20px; }
    .msg-body blockquote {
      margin: 6px 0;
      padding: 4px 10px;
      border-left: 3px solid var(--am-border);
      color: var(--am-muted);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 18px;
      color: var(--am-muted);
      gap: 8px;
    }

    /* Confirm Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 380px;
      background: var(--am-card);
      border: 1px solid var(--am-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--am-danger-fg); }
    .modal-desc { font-size: 12.5px; color: var(--am-muted); line-height: 1.5; word-break: break-word; }
    [hidden] { display: none !important; }
    .pager, .batch-report, .tag-resolution { padding: 5px 10px; font-size: 12px; }
    .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
    .batch-report { max-height: 18vh; overflow: auto; white-space: pre-line; }
    .delete-targets { max-height: 30vh; overflow-y: auto; padding-inline-start: 24px; overflow-wrap: anywhere; }
    .tag-resolution { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .tag-resolution span { flex-basis: 100%; overflow-wrap: anywhere; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

    /* Toast */
    .toast {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 9999;
      background: var(--popover, var(--am-card));
      color: var(--popover-foreground, var(--am-fg));
      border: 1px solid color-mix(in srgb, var(--am-accent) 32%, var(--am-border));
      padding: 9px 13px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 28px);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.18s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

        archiveError: (verb, error) => `${verb} failed · ${error}`, moreReasons: ', etc.', reasonSeparator: ', ', summarySeparator: ' · ',
        noticeSeparator: ' · ', loading: 'Loading…', loadingMessages: 'Reading message history…',
        previewMismatch: 'The response was for a different chat', previewFailed: 'Could not load preview',
        source: (label) => `Source · ${label}`, fullLog: 'Full transcript', compactLog: 'Compact transcript',
        mergedLog: 'Full and compact transcripts', indexLog: 'Index snippets', noSource: 'No available text', unknownSource: 'Unknown',
        noMessages: 'This chat has no text to preview. Select Open chat to view it.',
        userRole: '👤 User', assistantRole: '🤖 Assistant', expandMessage: 'Show full text ▾', foldMessage: 'Collapse ▴',
        tagsFailed: (error) => `Could not save tags · ${error}`, noteFailed: (error) => `Could not save note · ${error}`,
        exported: (filename) => `Exported · ${filename}`, revealFile: 'Show file',
        revealFailed: (error) => `Could not show the exported file · ${error}`, exportFailed: (error) => `Export failed · ${error}`,
        refreshed: 'Conversation list refreshed', noExports: 'Export a chat to create the export folder.',
        renamed: 'Chat renamed', deleted: 'Chat permanently deleted', deleteFailed: (error) => `Deletion failed · ${error}`,
        languageFailed: 'Could not save the display language. Please try again.',
      },
    };

    const browserLanguage = navigator.language;
    const defaultLocale = !browserLanguage || /^zh\b/i.test(browserLanguage) ? 'zh-CN' : 'en';
    const state = {
      locale: defaultLocale,
      tab: 'archived',
      query: '',
      projectKey: '',
      groupKey: '',
      searchMode: 'literal',
      page: 1,
      pageSize: 50,
      total: 0,
      snapshotId: null,
      staleIds: [],
      selectedTitles: new Map(),
      pendingBatch: null,
      deleteBusy: false,
      deleteReport: null,
      tag: '',
      sort: 'updated',
      staleDays: 7,
      items: [],
      listReady: false,
      archivePending: false,
      selectedId: null,
      previewData: null,
      rawMode: false,
      batchMode: false,
      checkedIds: new Set(),
      pendingDeleteId: null,
    };

    const MSG_COLLAPSE_THRESHOLD = 450;

    const $ = (id) => document.getElementById(id);
    const searchClientId = globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2);
    let searchTimer = null;
    let toastTimer = null;
    let toastContent;
    let listRequestId = 0;
    let previewRequestId = 0;
    let previewOverrides = {};
    const deletingIds = new Set();

    const dateFormats = new Map();
    function t(key, ...args) {
      const entry = messages[state.locale][key];
      return typeof entry === 'function' ? entry(...args) : entry;
    }

    function number(value) {
      return Number(value).toLocaleString(state.locale);
    }

    function plural(value, noun) {
      return `${number(value)} ${value === 1 ? noun : `${noun}s`}`;
    }

    function applyLocale(locale) {
      state.locale = locale;
      document.documentElement.lang = locale;
      document.title = t('brand');
      $('languageSelect').value = locale;
      for (const node of document.querySelectorAll('[data-i18n]')) {
        const pending = node.dataset.pendingAction;
        node.textContent = pending ? t('working', t(pending)) : t(node.dataset.i18n);
      }
      for (const node of document.querySelectorAll('[data-i18n-title]')) node.title = t(node.dataset.i18nTitle);
      for (const node of document.querySelectorAll('[data-i18n-placeholder]')) node.placeholder = t(node.dataset.i18nPlaceholder);
      for (const node of document.querySelectorAll('[data-i18n-label]')) node.setAttribute('aria-label', t(node.dataset.i18nLabel));
      for (const option of document.querySelectorAll('#staleDaysSelect option')) option.textContent = t('days', Number(option.value));
      updateBatchBar();
      updateDeleteDialog();
      renderDeleteReport();
      $('pvRawBtn').textContent = t(state.rawMode ? 'formatted' : 'raw');
      updatePreviewArchiveButton();
      updateToastText();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlightText(htmlSafe, q) {
      const trimmed = String(q || '').trim();
      if (!trimmed) return htmlSafe;
      const terms = state.searchMode === 'keywords'
        ? [...new Set(trimmed.split(/\s+/u).filter(Boolean))].sort((a, b) => b.length - a.length)
        : [trimmed];
      if (!terms.length) return htmlSafe;
      const pattern = terms.map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      try {
        const re = new RegExp(`(${pattern})`, 'gi');
        return htmlSafe.replace(/(<[^>]+>)|([^<]+)/g, (_, tag, text) => (
          tag || text.replace(re, '<mark>$1</mark>')
        ));
      } catch {
        return htmlSafe;
      }
    }

    function formatTime(ms, raw) {
      if (!ms) return raw ? raw.slice(0, 10) : t('unknownTime');
      const diffSec = Math.floor((Date.now() - ms) / 1000);
      if (diffSec < 60) return t('justNow');
      for (const [unit, seconds, limit] of [['minute', 60, 3600], ['hour', 3600, 86400], ['day', 86400, 86400 * 14]]) {
        if (diffSec < limit) return getDateFormats().relative.format(-Math.floor(diffSec / seconds), unit);
      }
      return getDateFormats().date.format(ms);
    }

    function getDateFormats() {
      const locale = state.locale;
      if (!dateFormats.has(locale)) {
        const date = { year: 'numeric', month: 'short', day: 'numeric' };
        dateFormats.set(locale, {
          date: new Intl.DateTimeFormat(locale, date),
          timestamp: new Intl.DateTimeFormat(locale, {
            ...date, hour: '2-digit', minute: '2-digit', second: '2-digit',
          }),
          relative: new Intl.RelativeTimeFormat(locale),
        });
      }
      return dateFormats.get(locale);
    }

    function formatTimestamp(raw) {
      if (!raw) return '';
      const ms = Date.parse(raw);
      return Number.isFinite(ms) ? getDateFormats().timestamp.format(ms) : raw;
    }

    function updateToastText() {
      if (!toastContent) return;
      $('toastText').textContent = typeof toastContent === 'function' ? toastContent() : t(toastContent);
      const btn = $('toastAction');
      if (btn.dataset.action) btn.textContent = t(btn.dataset.action);
    }

    function hideToast() {
      $('toast').classList.remove('show');
      toastContent = undefined;
      const btn = $('toastAction');
      delete btn.dataset.action;
      btn.onclick = null;
      btn.style.display = 'none';
    }

    function showToast(message, action, actionFn) {
      toastContent = message;
      const btn = $('toastAction');
      btn.disabled = false;
      if (action && actionFn) {
        btn.dataset.action = action;
        btn.style.display = 'inline-block';
        btn.onclick = () => {
          hideToast();
          return actionFn();
        };
      } else {
        delete btn.dataset.action;
        btn.textContent = '';
        btn.style.display = 'none';
        btn.onclick = null;
      }
      updateToastText();
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 5200);
    }

    function renderMarkdown(md, q) {
      const codeBlocks = [];
      let text = String(md || '').replace(/\r\n/g, '\n');
      text = text.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${highlightText(escapeHtml(code.trimEnd()), q)}</code></pre>`);
        return `@@CODEBLOCK_${idx}@@`;
      });

      const lines = text.split('\n');
      const out = [];
      let inList = false;

      for (const line of lines) {
        if (/^@@CODEBLOCK_\d+@@$/.test(line.trim())) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(line.trim());
          continue;
        }
        const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (hMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          const lvl = hMatch[1].length;
          out.push(`<h${lvl}>${formatInline(hMatch[2], q)}</h${lvl}>`);
          continue;
        }
        const bqMatch = line.match(/^>\s?(.*)$/);
        if (bqMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<blockquote>${formatInline(bqMatch[1], q)}</blockquote>`);
          continue;
        }
        const liMatch = line.match(/^\s*[-*+]\s+(.+)$/);
        if (liMatch) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${formatInline(liMatch[1], q)}</li>`);
          continue;
        }
        if (inList) { out.push('</ul>'); inList = false; }
        if (!line.trim()) continue;
        if (/^---+$/.test(line.trim())) {
          out.push('<hr style="border:0;border-top:1px solid var(--am-border);margin:8px 0;"/>');
          continue;
        }
        out.push(`<p>${formatInline(line, q)}</p>`);
      }
      if (inList) out.push('</ul>');

      let html = out.join('\n');
      codeBlocks.forEach((blk, idx) => {
        html = html.replace(`@@CODEBLOCK_${idx}@@`, blk);
      });
      return html;
    }

    function formatInline(raw, q) {
      let s = escapeHtml(raw);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--am-accent);">$1</a>');
      return highlightText(s, q);
    }

    async function apiPost(path, body = {}, locale = state.locale) {
      const res = await window.sidecar.fetch(path, {
        method: 'POST',
        body: JSON.stringify({ ...body, locale }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function updateBatchBar() {
      const pane = $('listPane');
      pane.classList.toggle('batch-mode', state.batchMode);
      pane.inert = !state.listReady && state.items.length > 0;
      $('batchBar').classList.toggle('show', state.batchMode);
      $('batchToggleBtn').classList.toggle('btn-primary', state.batchMode);
      const count = state.checkedIds.size;
      const canApply = state.listReady && !state.archivePending && !state.deleteBusy;
      const pageCount = Math.max(1, Math.ceil(state.total / state.pageSize));
      $('pager').hidden = pageCount <= 1;
      $('pageStatus').textContent = t('pageOf', state.page, pageCount, state.total);
      $('prevPageBtn').disabled = !state.listReady || state.page <= 1;
      $('nextPageBtn').disabled = !state.listReady || state.page >= pageCount;
      $('batchDeleteBtn').hidden = state.tab !== 'archived' || !state.batchMode;
      $('batchDeleteBtn').disabled = !canApply || count === 0;
      $('batchCountText').textContent = t('selected', count);
      $('selectAllBtn').disabled = !canApply || state.items.length === 0;
      $('batchRestoreBtn').disabled = !canApply || count === 0;
      $('batchArchiveBtn').disabled = !canApply || count === 0;
      $('archiveAllStaleBtn').disabled = !canApply || state.tab !== 'stale' || state.items.length === 0;
    }

    function invalidateList() {
      state.listReady = false;
      updateBatchBar();
      return ++listRequestId;
    }

    function showDataStatus(id, text) {
      const status = $(id);
      status.textContent = text;
      status.hidden = !text;
    }

    async function loadList({ refresh = false } = {}) {
      const requestId = invalidateList();
      try {
        const data = await apiPost('/api/conversations', {
          tab: state.tab,
          query: state.query,
          projectKey: state.projectKey,
          groupKey: state.groupKey,
          searchMode: state.searchMode,
          page: state.page,
          pageSize: state.pageSize,
          snapshotId: refresh ? null : state.snapshotId,
          searchClientId, searchSequence: requestId,
          includeMatchingIds: state.tab === 'stale',
          tag: state.tag,
          sort: state.sort,
          staleDays: state.staleDays,
        });
        if (requestId !== listRequestId) return false;
        if (data.cancelled) return false;
        state.items = data.items || [];
        state.page = data.page ?? 1;
        state.total = data.total ?? state.items.length;
        state.snapshotId = data.snapshotId ?? null;
        state.staleIds = data.matchingIds ?? (state.tab === 'stale' ? state.items.map(item => item.id) : []);
        showDataStatus('listWarning', (data.warnings || []).join(t('noticeSeparator')));

        // Keep explicitly selected chats from other pages.
        for (const item of state.items) {
          if (state.checkedIds.has(item.id)) state.selectedTitles.set(item.id, item.title);
        }

        for (const key of ['archived', 'active', 'starred', 'stale', 'all']) {
          const el = $(`cnt-${key}`);
          if (el) el.textContent = number(data.counts?.[key] ?? 0);
        }

        const groupOptions = data.groupOptions || [];
        const hasNativeGroups = groupOptions.some((opt) => typeof opt.key === 'string' && opt.key.startsWith('group:'));
        $('groupSelect').hidden = !hasNativeGroups && !state.groupKey;
        fillSelect('projectSelect', 'allProjects', data.projectOptions || [], state.projectKey);
        fillSelect('groupSelect', 'allGroups', groupOptions, state.groupKey);

        const tagSel = $('tagSelect');
        const curTag = state.tag;
        const allTags = data.allTags || [];
        tagSel.innerHTML = `<option value="" data-i18n="allTags">${escapeHtml(t('allTags'))}</option>`;
        for (const tagValue of allTags) {
          const opt = document.createElement('option');
          opt.value = tagValue;
          opt.textContent = `#${tagValue}`;
          if (tagValue === curTag) opt.selected = true;
          tagSel.appendChild(opt);
        }
        if (curTag && !allTags.includes(curTag)) {
          const fallbackOpt = document.createElement('option');
          fallbackOpt.value = curTag;
          fallbackOpt.textContent = `#${curTag}`;
          fallbackOpt.selected = true;
          tagSel.appendChild(fallbackOpt);
        }
        tagSel.value = curTag;

        state.listReady = true;
        updateBatchBar();
        renderList();
        return true;
      } catch (err) {
        if (requestId !== listRequestId) return false;
        state.items = [];
        resetSelection();
        state.listReady = false;
        showDataStatus('listWarning', '');
        updateBatchBar();
        $('listPane').innerHTML = `<div class="empty-state" role="status">${escapeHtml(t('loadFailed', err.message))}</div>`;
        return false;
      }
    }

    function fillSelect(id, allLabel, options, selected) {
      const select = $(id);
      select.innerHTML = `<option value="" data-i18n="${allLabel}">${escapeHtml(t(allLabel))}</option>`;
      for (const { key, label } of options) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = label;
        select.appendChild(option);
      }
      if (selected && !options.some((opt) => opt.key === selected)) {
        const fallback = document.createElement('option');
        fallback.value = selected;
        fallback.textContent = selected;
        select.appendChild(fallback);
      }
      select.value = selected;
    }

    function selectItem(item, selected) {
      if (selected) {
        state.checkedIds.add(item.id);
        state.selectedTitles.set(item.id, item.title || item.id);
      } else {
        state.checkedIds.delete(item.id);
        state.selectedTitles.delete(item.id);
      }
    }

    function resetSelection() {
      state.checkedIds.clear();
      state.selectedTitles.clear();
      if (state.pendingBatch) closeDeleteModal();
    }

    function resetFilters() {
      resetSelection();
      state.page = 1;
      state.deleteReport = null;
      renderDeleteReport();
    }

    function renderList() {
      const pane = $('listPane');
      if (!state.items.length) {
        const hints = { archived: 'noArchived', starred: 'noStarred', stale: 'noStale' };
        const hint = state.query ? t('noMatches', state.query) : t(hints[state.tab] ?? 'noSessions', state.staleDays);
        pane.innerHTML = `<div class="empty-state"><div style="font-size:24px;">📭</div><div>${escapeHtml(hint)}</div></div>`;
        return;
      }

      pane.innerHTML = '';
      for (const item of state.items) {
        const card = document.createElement('div');
        card.className = 'conv-card' + (item.id === state.selectedId ? ' selected' : '');

        const statusBadge = item.isRunning
          ? `<span class="pill pill-run"><span class="run-dot"></span>${escapeHtml(t('running'))}</span>`
          : item.archived
            ? `<span class="pill pill-archived">${escapeHtml(t('archived'))}</span>`
            : `<span class="pill pill-active">${escapeHtml(t('active'))}</span>`;

        const tagsHtml = (item.tags || [])
          .map((t) => `<span class="pill pill-tag">#${escapeHtml(t)}</span>`)
          .join('');
        const snippetHtml = item.matchSnippet
          ? `<div class="card-snippet">${highlightText(escapeHtml(item.matchSnippet), state.query)}</div>`
          : '';
        const noteHtml = item.note
          ? `<div class="card-note">📝 ${highlightText(escapeHtml(item.note), state.query)}</div>`
          : '';

        const stepText = item.stepCount > 0 ? `<span>${escapeHtml(t('steps', item.stepCount))}</span><span>·</span>` : '';
        const archiveAction = item.archived ? 'restore' : 'archive';
        const archiveHelp = item.archived ? 'restoreHelp' : item.isRunning ? 'runningHelp' : 'archiveHelp';
        const pinLabel = escapeHtml(t(item.pinned ? 'unpin' : 'pin'));
        const starLabel = escapeHtml(t(item.starred ? 'unstar' : 'star'));

        card.innerHTML = `
          <div class="card-top">
            <div class="card-top-left">
              <input type="checkbox" class="card-check" aria-label="${escapeHtml(t('selectChat', item.title))}" ${state.checkedIds.has(item.id) ? 'checked' : ''} />
              <div class="card-title">${highlightText(escapeHtml(item.title), state.query)}</div>
            </div>
            <div class="icon-toggles">
              <button class="icon-btn js-pin ${item.pinned ? 'pinned' : ''}" title="${pinLabel}" aria-label="${pinLabel}">📌</button>
              <button class="icon-btn js-star ${item.starred ? 'starred' : ''}" title="${starLabel}" aria-label="${starLabel}">${item.starred ? '★' : '☆'}</button>
            </div>
          </div>
          <div class="card-meta">
            ${statusBadge}
            <span class="pill pill-proj">${escapeHtml(item.projectLabel ?? item.project)}</span>
            ${item.groupId ? `<span class="pill">${escapeHtml(item.groupId)}</span>` : ''}
            ${stepText}
            <span>${escapeHtml(formatTime(item.lastModifiedMs, item.lastModified))}</span>
            ${tagsHtml}
          </div>
          ${noteHtml}
          ${snippetHtml}
          <div class="card-actions">
            <button class="btn btn-sm js-open">${escapeHtml(t('openChat'))}</button>
            <button class="btn btn-sm btn-${archiveAction} js-toggle-archive" title="${escapeHtml(t(archiveHelp))}" ${item.isRunning && !item.archived ? 'disabled' : ''}>${escapeHtml(t(`${archiveAction}Button`))}</button>
          </div>
        `;

        card.addEventListener('click', () => {
          if (state.batchMode) {
            selectItem(item, !state.checkedIds.has(item.id));
            updateBatchBar();
            renderList();
            return;
          }
          openPreview(item.id);
        });

        card.querySelector('.card-check').addEventListener('click', (e) => {
          e.stopPropagation();
          selectItem(item, e.target.checked);
          updateBatchBar();
        });

        card.querySelector('.js-pin').addEventListener('click', async (e) => {
          e.stopPropagation();
          await updateNativeAnnotation(item.id, { pinned: !item.pinned }, item.pinned ? 'unpinned' : 'pinned');
        });
        card.querySelector('.js-star').addEventListener('click', async (e) => {
          e.stopPropagation();
          await updateNativeAnnotation(item.id, { starred: !item.starred }, item.starred ? 'unstarred' : 'starred');
        });
        card.querySelector('.js-open').addEventListener('click', (e) => {
          e.stopPropagation();
          openConversationInHost(item.id);
        });
        card.querySelector('.js-toggle-archive').addEventListener('click', async (e) => {
          e.stopPropagation();
          await setConversationsArchived([item.id], !item.archived, e.currentTarget);
        });

        pane.appendChild(card);
      }
    }

    function openConversationInHost(convId) {
      if (window.sidecar?.ui?.toggleConversation) {
        window.sidecar.ui.toggleConversation(convId);
        showToast('hostOpened');
      } else {
        showToast('hostUnavailable');
      }
    }

    function applyPreviewPatch(convId, patch) {
      if (state.selectedId === convId) Object.assign(previewOverrides, patch);
      if (state.previewData?.id === convId) {
        Object.assign(state.previewData, patch);
        updatePreviewHeaderState();
      }
    }

    async function updateNativeAnnotation(convId, patch, successMsg) {
      try {
        await apiPost('/api/meta/update', { conversationId: convId, ...patch });
        applyPreviewPatch(convId, patch);
        if (successMsg) showToast(successMsg);
        await loadList();
      } catch (err) {
        showToast(() => t('updateFailed', err.message));
      }
    }

    function setConversationsArchived(ids, archived, triggerBtn, staleDays) {
      if (!ids.length) return;
      return applyArchiveChange({ conversationIds: ids, archived, staleDays }, archived ? 'archive' : 'restore', triggerBtn);
    }

    async function applyArchiveChange(request, verb, triggerBtn) {
      if (state.archivePending) return;
      state.archivePending = true;
      const toastAction = $('toastAction');
      if (toastAction.dataset.action === 'undo') toastAction.disabled = true;
      if (triggerBtn) {
        triggerBtn.dataset.pendingAction = verb;
        triggerBtn.disabled = true;
        triggerBtn.textContent = t('working', t(verb));
      }
      updateBatchBar();
      const requestLocale = state.locale;
      try {
        const { succeeded, unchanged, failed, changes } = await apiPost('/api/set-archived', request);
        for (const id of [...succeeded, ...unchanged]) {
          state.checkedIds.delete(id);
          state.selectedTitles.delete(id);
        }
        const selectedId = state.selectedId;
        const previewChange = changes.find((change) => change.id === selectedId);
        const archiveState = previewChange?.archived ?? (unchanged.includes(selectedId)
          ? (request.undo?.find((change) => change.id === selectedId)?.previousArchived ?? request.archived)
          : undefined);
        if (typeof archiveState === 'boolean') applyPreviewPatch(selectedId, { archived: archiveState });
        void loadList();
        const canUndo = !request.undo && changes.length > 0;
        const summarize = () => {
          const summary = [t('archiveSuccess', t(verb), succeeded.length)];
          if (unchanged.length) summary.push(t('archiveUnchanged', unchanged.length));
          if (failed.length) {
            const reasons = requestLocale === state.locale ? [...new Set(failed.map(({ error }) => error))] : [];
            const details = reasons.slice(0, 3).join(t('reasonSeparator')) + (reasons.length > 3 ? t('moreReasons') : '');
            summary.push(t('archiveFailures', failed.length, details));
          }
          return summary.join(t('summarySeparator'));
        };
        showToast(summarize, canUndo ? 'undo' : null,
          canUndo ? () => applyArchiveChange({ undo: changes }, 'undo') : null);
      } catch (err) {
        showToast(() => t('archiveError', t(verb), err.message));
      } finally {
        state.archivePending = false;
        if (triggerBtn) {
          delete triggerBtn.dataset.pendingAction;
          triggerBtn.textContent = t(triggerBtn.dataset.i18n ?? `${verb}Button`);
          if (triggerBtn === $('pvArchiveToggleBtn')) updatePreviewArchiveButton();
          else triggerBtn.disabled = false;
        }
        updateBatchBar();
      }
    }

    function setPreviewControlsReady(ready) {
      for (const id of ['pvRenameBtn', 'pvTitleInput', 'pvOpenBtn', 'pvArchiveToggleBtn', 'pvExportFileBtn',
        'pvRawBtn', 'pvDeleteBtn', 'tagInput', 'noteInput', 'pvCollapseAllBtn', 'pvScrollTopBtn', 'pvScrollBottomBtn']) {
        $(id).disabled = !ready;
      }
      $('pvMetaEditor').style.display = ready ? '' : 'none';
    }

    function closeDeleteModal() {
      state.pendingDeleteId = null;
      state.pendingBatch = null;
      $('deleteTargets').hidden = true;
      $('deleteModal').classList.remove('show');
    }

    async function openPreview(convId, { refreshLocale = false } = {}) {
      if (deletingIds.has(convId)) return;
      const previous = refreshLocale && state.previewData?.id === convId ? state.previewData : null;
      const requestId = ++previewRequestId;
      previewOverrides = {};
      state.selectedId = convId;
      state.previewData = null;
      if (!state.pendingBatch) closeDeleteModal();
      if (previous && $('pvTitleInput').style.display !== 'none') $('pvRenameBtn').textContent = t('save');
      else exitTitleEdit();
      setPreviewControlsReady(false);
      showDataStatus('pvSource', '');
      if (!refreshLocale) $('mainSplit').classList.add('show-preview');
      $('previewEmpty').style.display = 'none';
      $('previewContent').style.display = 'flex';
      $('pvTitle').textContent = t('loading');
      $('pvMessages').innerHTML = `<div class="empty-state">${escapeHtml(t('loadingMessages'))}</div>`;
      syncCollapseAllBtn();
      if (state.listReady) renderList();

      try {
        const data = await apiPost('/api/preview', { conversationId: convId });
        if (requestId !== previewRequestId) return;
        if (data.id !== convId) throw new Error(t('previewMismatch'));
        state.previewData = Object.assign(data, previewOverrides);
        if (!previous) $('tagInput').value = '';
        if (!previous || $('noteInput').value === (previous.note || '')) $('noteInput').value = data.note || '';
        setPreviewControlsReady(true);
        renderPreview();
      } catch (err) {
        if (requestId !== previewRequestId) return;
        state.previewData = null;
        setPreviewControlsReady(false);
        showDataStatus('pvSource', '');
        exitTitleEdit();
        $('pvTitle').textContent = t('previewFailed');
        $('pvMessages').innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    function exitTitleEdit() {
      $('pvTitle').style.display = '';
      $('pvTitleInput').style.display = 'none';
      $('pvRenameBtn').textContent = t('rename');
    }

    function updatePreviewArchiveButton() {
      const archBtn = $('pvArchiveToggleBtn');
      const d = state.previewData;
      const pending = archBtn.dataset.pendingAction;
      const action = d?.archived ? 'restore' : 'archive';
      archBtn.disabled = Boolean(!d || pending || (d.isRunning && !d.archived));
      archBtn.textContent = pending ? t('working', t(pending)) : t(`${action}Button`);
      archBtn.title = t(d?.isRunning && !d.archived ? 'runningHelp' : `${action}Help`);
      archBtn.classList.toggle('btn-restore', Boolean(d?.archived));
      archBtn.classList.toggle('btn-archive', !d?.archived);
    }

    function updatePreviewHeaderState() {
      const d = state.previewData;
      if (!d) return;
      $('pvTitle').textContent = d.title;
      updatePreviewArchiveButton();
      $('pvRawBtn').textContent = t(state.rawMode ? 'formatted' : 'raw');
      $('pvDeleteBtn').disabled = Boolean(d.isRunning);
      const sourceLabels = {
        transcript_full: 'fullLog',
        transcript: 'compactLog',
        'transcript_full+transcript': 'mergedLog',
        fts: 'indexLog',
        none: 'noSource',
      };
      const pvWarnings = d.warnings || [];
      const showSourceBanner = Boolean(pvWarnings.length) || (Boolean(d.source) && d.source !== 'transcript_full');
      showDataStatus(
        'pvSource',
        showSourceBanner ? [t('source', t(sourceLabels[d.source] ?? 'unknownSource')), ...pvWarnings].join(t('noticeSeparator')) : ''
      );

      $('tagConflictBox').hidden = !d.tagConflict;
      if (d.tagConflict) {
        const display = tags => tags?.join(', ') || t('emptyTags');
        $('tagConflictText').textContent = t('conflictLabels', display(d.tags), display(d.nativeTags));
      }
      const row = $('pvTagsRow');
      const input = $('tagInput');
      row.querySelectorAll('.tag-chip').forEach((n) => n.remove());
      for (const tag of d.tags || []) {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        const label = escapeHtml(t('removeTag', tag));
        chip.innerHTML = `<span>#${escapeHtml(tag)}</span><button type="button" title="${label}" aria-label="${label}">×</button>`;
        chip.querySelector('button').addEventListener('click', async () => {
          const nextTags = (d.tags || []).filter((x) => x !== tag);
          await saveTags(d.id, nextTags);
        });
        row.insertBefore(chip, input);
      }
    }

    function syncCollapseAllBtn() {
      const box = $('pvMessages');
      const allBlocks = box.querySelectorAll('.msg-block');
      const longBlocks = box.querySelectorAll('.msg-block.is-long');
      const btn = $('pvCollapseAllBtn');
      const hasMsgs = allBlocks.length > 0;
      btn.disabled = !hasMsgs;
      $('pvScrollTopBtn').disabled = !hasMsgs;
      $('pvScrollBottomBtn').disabled = !hasMsgs;
      if (!hasMsgs) {
        btn.textContent = t('expandAll');
        btn.title = t('expandAllHelp');
        return;
      }
      if (longBlocks.length > 0) {
        const hasCollapsed = Boolean(box.querySelector('.msg-block.is-collapsed, .msg-block.is-folded'));
        btn.textContent = t(hasCollapsed ? 'expandAll' : 'foldAll');
        btn.title = t(hasCollapsed ? 'expandLongHelp' : 'foldLongHelp');
      } else {
        const hasFolded = Boolean(box.querySelector('.msg-block.is-folded'));
        btn.textContent = t(hasFolded ? 'expandAll' : 'foldAll');
        btn.title = t(hasFolded ? 'expandAllHelp' : 'foldAllHelp');
      }
    }

    function toggleCollapseAllMessages() {
      const box = $('pvMessages');
      const allBlocks = [...box.querySelectorAll('.msg-block')];
      const longBlocks = [...box.querySelectorAll('.msg-block.is-long')];
      if (longBlocks.length > 0) {
        const shouldExpand = Boolean(box.querySelector('.msg-block.is-collapsed, .msg-block.is-folded'));
        for (const blk of allBlocks) blk.classList.remove('is-folded');
        for (const blk of longBlocks) {
          blk.classList.toggle('is-collapsed', !shouldExpand);
          const eb = blk.querySelector('.msg-expand-btn');
          if (eb) eb.textContent = t(shouldExpand ? 'foldMessage' : 'expandMessage');
        }
      } else if (allBlocks.length > 0) {
        const shouldExpand = Boolean(box.querySelector('.msg-block.is-folded'));
        for (const blk of allBlocks) {
          blk.classList.toggle('is-folded', !shouldExpand);
        }
      }
      syncCollapseAllBtn();
    }

    function renderPreview() {
      const d = state.previewData;
      if (!d) return;
      updatePreviewHeaderState();

      const box = $('pvMessages');
      if (!d.messages || !d.messages.length) {
        box.innerHTML = `<div class="empty-state">${escapeHtml(t('noMessages'))}</div>`;
        syncCollapseAllBtn();
        return;
      }

      box.innerHTML = '';
      for (const m of d.messages) {
        const blk = document.createElement('div');
        blk.className = `msg-block ${m.role}`;
        const roleLabel = t(m.role === 'user' ? 'userRole' : 'assistantRole');
        const tsLabel = formatTimestamp(m.timestamp);
        const bodyHtml = state.rawMode
          ? highlightText(escapeHtml(m.content), state.query)
          : renderMarkdown(m.content, state.query);

        blk.innerHTML = `
          <div class="msg-head">
            <span>${escapeHtml(roleLabel)}</span>
            <span style="font-weight:400;">${escapeHtml(tsLabel)}</span>
          </div>
          <div class="msg-body-wrap">
            <div class="msg-body ${state.rawMode ? 'raw' : ''}">${bodyHtml}</div>
            <div class="msg-fade"></div>
          </div>
          <button type="button" class="msg-expand-btn" style="display:none;">${escapeHtml(t('expandMessage'))}</button>
        `;
        box.appendChild(blk);

        const bodyEl = blk.querySelector('.msg-body');
        const expandBtn = blk.querySelector('.msg-expand-btn');
        if (bodyEl.scrollHeight > MSG_COLLAPSE_THRESHOLD) {
          blk.classList.add('is-long', 'is-collapsed');
          expandBtn.style.display = 'block';
        }
        expandBtn.addEventListener('click', () => {
          const willCollapse = !blk.classList.contains('is-collapsed');
          blk.classList.toggle('is-collapsed', willCollapse);
          expandBtn.textContent = t(willCollapse ? 'expandMessage' : 'foldMessage');
          if (willCollapse && blk.getBoundingClientRect().top < box.getBoundingClientRect().top) {
            blk.scrollIntoView({ block: 'nearest' });
          }
          syncCollapseAllBtn();
        });
        blk.querySelector('.msg-head').addEventListener('click', () => {
          if (blk.classList.contains('is-folded')) {
            blk.classList.remove('is-folded');
            syncCollapseAllBtn();
          }
        });
      }
      box.scrollTop = 0;
      syncCollapseAllBtn();
    }

    async function saveTags(convId, tags, tagResolution) {
      try {
        const res = await apiPost('/api/meta/update', { conversationId: convId, tags, tagResolution });
        applyPreviewPatch(convId, { tags: res.meta.tags, nativeTags: res.meta.nativeTags, tagConflict: res.meta.tagConflict });
        await loadList();
      } catch (err) {
        showToast(() => t('tagsFailed', err.message));
        if (state.selectedId === convId) await openPreview(convId, { refreshLocale: true });
        await loadList({ refresh: true });
      }
    }

    async function saveNote(convId, note) {
      try {
        const res = await apiPost('/api/meta/update', { conversationId: convId, note });
        applyPreviewPatch(convId, { note: res.meta.note || '' });
        await loadList();
      } catch (err) {
        showToast(() => t('noteFailed', err.message));
      }
    }

    async function exportConversationToFile(convId) {
      try {
        const res = await apiPost('/api/export', { conversationId: convId, saveToDisk: true });
        showToast(() => t('exported', res.filename), 'revealFile', async () => {
          try {
            await apiPost('/api/reveal-file', { path: res.savedPath, isFile: true });
          } catch (err) {
            showToast(() => t('revealFailed', err.message));
          }
        });
      } catch (err) {
        showToast(() => t('exportFailed', err.message));
      }
    }

    async function initializePanel() {
      const select = $('languageSelect');
      applyLocale(defaultLocale);
      try {
        const { language } = await apiPost('/api/preferences');
        if (Object.hasOwn(messages, language)) applyLocale(language);
      } catch {
        // The WebView language still applies if the preferences are unavailable.
      } finally {
        select.disabled = false;
      }
      await loadList();
    }

    $('languageSelect').addEventListener('change', async () => {
      const select = $('languageSelect');
      const language = select.value;
      if (select.disabled || language === state.locale || !Object.hasOwn(messages, language)) return;
      showDataStatus('languageStatus', '');
      select.disabled = true;
      try {
        const saved = await apiPost('/api/preferences', { language }, language);
        if (saved.language !== language) throw new Error();
        applyLocale(language);
      } catch {
        select.value = state.locale;
        showDataStatus('languageStatus', t('languageFailed'));
        return;
      } finally {
        select.disabled = false;
      }

      clearTimeout(searchTimer);
      showDataStatus('listWarning', '');
      $('listPane').innerHTML = `<div class="empty-state" role="status">${escapeHtml(t('loading'))}</div>`;
      const list = loadList();
      const preview = state.selectedId && openPreview(state.selectedId, { refreshLocale: true });
      await Promise.all([list, preview]);
    });

    // Tabs & Filter events
    $('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      state.tab = btn.dataset.tab;
      resetFilters();
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
      $('staleBar').classList.toggle('show', state.tab === 'stale');
      loadList();
    });

    $('searchInput').addEventListener('input', (e) => {
      const val = e.target.value;
      $('clearSearchBtn').classList.toggle('show', Boolean(val));
      state.query = val.trim();
      resetFilters();
      invalidateList();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadList();
        if (state.previewData) renderPreview();
      }, 200);
    });

    $('clearSearchBtn').addEventListener('click', () => {
      clearTimeout(searchTimer);
      $('searchInput').value = '';
      $('clearSearchBtn').classList.remove('show');
      state.query = '';
      resetFilters();
      loadList();
      if (state.previewData) renderPreview();
    });

    for (const [id, key] of [['projectSelect', 'projectKey'], ['groupSelect', 'groupKey'], ['searchModeSelect', 'searchMode'],
      ['tagSelect', 'tag'], ['sortSelect', 'sort'], ['staleDaysSelect', 'staleDays']]) {
      $(id).addEventListener('change', e => {
        state[key] = key === 'staleDays' ? Number(e.target.value) || 7 : e.target.value;
        resetFilters();
        const req = loadList();
        if (key === 'searchMode' && state.previewData) renderPreview();
        return req;
      });
    }

    for (const [id, delta] of [['prevPageBtn', -1], ['nextPageBtn', 1]]) {
      $(id).addEventListener('click', () => {
        if ($(id).disabled) return;
        state.page += delta;
        return loadList();
      });
    }

    $('refreshBtn').addEventListener('click', async () => {
      if (state.selectedId) openPreview(state.selectedId);
      if (await loadList({ refresh: true })) showToast('refreshed');
    });

    $('openExportDirBtn').addEventListener('click', async () => {
      try {
        await apiPost('/api/reveal-file', { path: '', isFile: false });
      } catch {
        showToast('noExports');
      }
    });

    // Batch actions
    $('batchToggleBtn').addEventListener('click', () => {
      state.batchMode = !state.batchMode;
      if (!state.batchMode) resetSelection();
      updateBatchBar();
      renderList();
    });
    $('batchExitBtn').addEventListener('click', () => {
      state.batchMode = false;
      resetSelection();
      updateBatchBar();
      renderList();
    });
    $('selectAllBtn').addEventListener('click', () => {
      if (!state.listReady || state.archivePending) return;
      const eligible = state.items.filter((i) => !i.isRunning);
      const selectPage = !eligible.every(i => state.checkedIds.has(i.id));
      for (const item of eligible) selectItem(item, selectPage);
      updateBatchBar();
      renderList();
    });
    $('batchRestoreBtn').addEventListener('click', (e) => {
      if (state.listReady) return setConversationsArchived([...state.checkedIds], false, e.currentTarget);
    });
    $('batchArchiveBtn').addEventListener('click', (e) => {
      if (state.listReady) return setConversationsArchived([...state.checkedIds], true, e.currentTarget);
    });
    $('archiveAllStaleBtn').addEventListener('click', (e) => {
      if (!state.listReady || state.tab !== 'stale') return;
      return setConversationsArchived(state.staleIds, true, e.currentTarget, state.staleDays);
    });

    // Preview toolbar events
    $('backBtn').addEventListener('click', () => $('mainSplit').classList.remove('show-preview'));
    $('pvOpenBtn').addEventListener('click', () => {
      if (state.previewData) openConversationInHost(state.previewData.id);
    });
    $('pvArchiveToggleBtn').addEventListener('click', (e) => {
      if (state.previewData) setConversationsArchived([state.previewData.id], !state.previewData.archived, e.currentTarget);
    });
    $('pvExportFileBtn').addEventListener('click', () => {
      if (state.previewData) exportConversationToFile(state.previewData.id);
    });
    $('pvRawBtn').addEventListener('click', () => {
      state.rawMode = !state.rawMode;
      renderPreview();
    });
    $('pvCollapseAllBtn').addEventListener('click', toggleCollapseAllMessages);
    $('pvScrollTopBtn').addEventListener('click', () => {
      $('pvMessages').scrollTo({ top: 0, behavior: 'smooth' });
    });
    $('pvScrollBottomBtn').addEventListener('click', () => {
      const box = $('pvMessages');
      box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
    });

    // Inline native rename
    async function commitTitleEdit() {
      const input = $('pvTitleInput');
      if (input.style.display === 'none' || !state.previewData) return;
      const nextTitle = input.value.trim();
      const oldTitle = state.previewData.title;
      exitTitleEdit();
      if (nextTitle && nextTitle !== oldTitle) {
        await updateNativeAnnotation(state.previewData.id, { title: nextTitle }, 'renamed');
      }
    }
    $('pvRenameBtn').addEventListener('click', () => {
      if (!state.previewData) return;
      const input = $('pvTitleInput');
      if (input.style.display !== 'none') {
        commitTitleEdit();
        return;
      }
      $('pvTitle').style.display = 'none';
      input.style.display = 'block';
      input.value = state.previewData.title || '';
      $('pvRenameBtn').textContent = t('save');
      input.focus();
      input.select();
    });
    $('pvTitleInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commitTitleEdit(); }
      if (e.key === 'Escape') { e.preventDefault(); exitTitleEdit(); }
    });

    function updateDeleteDialog() {
      const batch = state.pendingBatch;
      if (batch) {
        $('deleteModalDesc').textContent = t('batchConfirm', batch.length);
        const list = $('deleteTargets');
        list.innerHTML = '';
        for (const { id, title } of batch) {
          const entry = document.createElement('li');
          entry.textContent = title === id ? id : `${title} (${id})`;
          list.appendChild(entry);
        }
        list.hidden = false;
      } else if (state.pendingDeleteId && state.previewData) {
        $('deleteModalDesc').textContent = t('deleteConfirm', state.previewData.title);
      }
    }

    function renderDeleteReport() {
      const report = state.deleteReport;
      $('batchReport').hidden = !report;
      if (!report) return;
      const { deleted, skipped, failed, warnings, titles } = report;
      $('batchSummary').textContent = t('deleteResult', deleted.length, skipped.length, failed.length);
      const describe = id => titles.get(id) || id;
      const lines = [
        ...deleted.map(id => t('deletedItem', describe(id))),
        ...skipped.map(row => t('skippedItem', describe(row.id), row.reason)),
        ...failed.map(row => t('failedItem', describe(row.id), row.reason)),
        ...warnings,
      ];
      $('batchDetails').textContent = lines.join('\n');
    }

    function clearPreview() {
      ++previewRequestId;
      state.selectedId = null;
      state.previewData = null;
      $('previewContent').style.display = 'none';
      $('previewEmpty').style.display = 'flex';
      $('mainSplit').classList.remove('show-preview');
    }

    async function deleteBatch(batch) {
      if (state.deleteBusy || !batch.length) return;
      state.deleteBusy = true;
      const titles = new Map(batch.map(({ id, title }) => [id, title]));
      for (const id of titles.keys()) deletingIds.add(id);
      updateBatchBar();
      try {
        const result = await apiPost('/api/delete-batch', { conversationIds: [...titles.keys()] });
        const { deleted, skipped, failed, warnings = [] } = result;
        const retryable = new Set(failed.filter(row => row.retryable).map(row => row.id));
        for (const id of titles.keys()) {
          if (!retryable.has(id)) {
            state.checkedIds.delete(id);
            state.selectedTitles.delete(id);
          }
        }
        state.deleteReport = { deleted, skipped, failed, warnings, titles };
        renderDeleteReport();
        $('batchReport').open = Boolean(skipped.length || failed.length || warnings.length);
        if (deleted.includes(state.selectedId) || skipped.some(row => row.id === state.selectedId && row.code === 'already_gone')) clearPreview();
      } catch (err) {
        resetSelection();
        showToast(() => t('deleteFailed', err.message));
      } finally {
        state.deleteBusy = false;
        for (const id of titles.keys()) deletingIds.delete(id);
        await loadList({ refresh: true });
        if (titles.has(state.selectedId)) await openPreview(state.selectedId);
        updateBatchBar();
      }
    }

    $('batchDeleteBtn').addEventListener('click', () => {
      if (state.tab !== 'archived' || !state.batchMode || !state.listReady || state.deleteBusy || state.archivePending) return;
      const batch = [...state.checkedIds].map(id => ({ id, title: state.selectedTitles.get(id) || id }));
      if (!batch.length) return;
      state.pendingDeleteId = null;
      state.pendingBatch = batch;
      updateDeleteDialog();
      $('deleteModal').classList.add('show');
      $('deleteCancelBtn').focus?.();
    });
    $('deleteModal').addEventListener('keydown', event => {
      if (event.key === 'Escape') closeDeleteModal();
    });

    // Safe delete modal
    $('pvDeleteBtn').addEventListener('click', () => {
      if (!state.previewData || state.previewData.isRunning || state.deleteBusy) return;
      state.pendingBatch = null;
      state.pendingDeleteId = state.previewData.id;
      $('deleteModalDesc').textContent = t('deleteConfirm', state.previewData.title);
      $('deleteModal').classList.add('show');
      $('deleteCancelBtn').focus?.();
    });
    $('deleteCancelBtn').addEventListener('click', closeDeleteModal);
    $('deleteConfirmBtn').addEventListener('click', async () => {
      const batch = state.pendingBatch;
      const id = state.pendingDeleteId;
      closeDeleteModal();
      if (batch) return deleteBatch(batch);
      if (!id || id !== state.previewData?.id || deletingIds.has(id)) return;
      const preview = state.previewData;
      const requestId = previewRequestId;
      const requestLocale = state.locale;
      let reloadPreview = false;
      deletingIds.add(id);
      state.previewData = null;
      setPreviewControlsReady(false);
      try {
        const result = await apiPost('/api/delete', { conversationId: id });
        if (state.selectedId === id) {
          clearPreview();
        }
        showToast(() => [t('deleted'), ...(result.warnings || [])].join(t('noticeSeparator')));
        await loadList();
      } catch (err) {
        if (state.selectedId === id && !state.previewData && previewRequestId === requestId) {
          reloadPreview = requestLocale !== state.locale;
          if (!reloadPreview) {
            state.previewData = preview;
            setPreviewControlsReady(true);
            renderPreview();
          }
        }
        showToast(() => t('deleteFailed', err.message));
      } finally {
        deletingIds.delete(id);
      }
      if (reloadPreview) await openPreview(id, { refreshLocale: true });
    });

    for (const [id, resolution] of [['useNativeTags', 'native'], ['useLocalTags', 'local']]) {
      $(id).addEventListener('click', async () => {
        const chat = state.previewData;
        if (chat?.tagConflict) await saveTags(chat.id, undefined, resolution);
      });
    }

    // Tags & note inputs
    $('tagInput').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !state.previewData) return;
      e.preventDefault();
      const val = e.target.value.trim().replace(/^#+/, '');
      if (!val) return;
      e.target.value = '';
      const nextTags = [...new Set([...(state.previewData.tags || []), val])];
      await saveTags(state.previewData.id, nextTags);
    });
    $('noteInput').addEventListener('blur', () => {
      if (state.previewData && $('noteInput').value.trim() !== (state.previewData.note || '')) {
        saveNote(state.previewData.id, $('noteInput').value);
      }
    });
    $('noteInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); $('noteInput').blur(); }
    });

    // Initial load & auto-refresh on focus
    initializePanel();
    window.addEventListener('focus', () => {
      if (!$('languageSelect').disabled) loadList({ refresh: true });
    });
  </script>
</body>
</html>
