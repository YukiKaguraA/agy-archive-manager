    function renderUpdateSection() {
      const status = state.updateStatus;
      const mode = state.preferences.pluginUpdateMode || status?.updateMode || 'manual';
      const updateSel = $('updateModeSelect');
      if (updateSel) updateSel.value = mode;

      const curVer = status?.currentVersion || '';
      const latVer = status?.latestVersion || '';
      const modeTag = t(status?.installMode === 'git' ? 'updateModeGit' : 'updateModeArchive');
      const available = Boolean(status?.updateAvailable && mode !== 'off');

      $('updateDot').hidden = !available;
      $('updateCurrentVersion').textContent = curVer ? `v${curVer}` : 'v—';
      const curSub = $('updateCurrentSub');
      if (status) {
        curSub.classList.toggle('is-available', available);
        curSub.textContent = mode === 'off'
          ? t('updateOffSub', modeTag)
          : status.updateAvailable
            ? t('updateAvailableSub', latVer, modeTag)
            : t('updateLatestSub', modeTag);
      } else {
        curSub.classList.remove('is-available');
        curSub.textContent = '';
      }

      $('updateLatestVersion').textContent = latVer ? `v${latVer}` : '—';
      $('updateLatestSub').textContent = status?.checkedAtMs
        ? t('updateRemoteChecked', formatTimestamp(status.checkedAtMs))
        : t('updateNotChecked');

      const releaseLink = $('openReleaseLink');
      if (status?.releaseUrl) {
        releaseLink.href = status.releaseUrl;
        releaseLink.hidden = false;
      } else {
        releaseLink.hidden = true;
      }

      const checkBtn = $('checkUpdateBtn');
      const applyBtn = $('applyUpdateBtn');
      checkBtn.disabled = state.settingsBusy || state.updateBusy;
      checkBtn.textContent = state.updateBusy && !status?.updateAvailable
        ? t('checkingUpdate')
        : status?.updateAvailable
          ? t('recheckUpdate')
          : t('checkUpdate');
      applyBtn.hidden = !status?.updateAvailable;
      applyBtn.disabled = state.settingsBusy || state.updateBusy;
      if (latVer) applyBtn.textContent = state.updateBusy ? t('applyingUpdate') : t('upgradeToVersion', latVer);
      if (status?.lastError && !$('updateStatusFeedback').textContent) {
        $('updateStatusFeedback').textContent = status.lastError;
      }
    }

    function renderSettings() {
      const { exportDir, defaultExportDir, trashSummary } = state.preferences;
      $('exportDirEffective').textContent = defaultExportDir
        ? t('exportDirEffective', exportDir || defaultExportDir, defaultExportDir) : '';
      $('trashSummary').textContent = trashSummary
        ? t('trashSummary', trashSummary.totalCount, trashSummary.expiredCount) : '';
      for (const id of ['languageSelect', 'updateModeSelect', 'saveExportDirBtn', 'pickExportDirBtn', 'resetExportDirBtn', 'saveRetentionBtn', 'sweepTrashBtn']) {
        $(id).disabled = state.settingsBusy || state.updateBusy;
      }
      for (const btn of $('themeAccentPicker')?.querySelectorAll?.('button') || []) {
        btn.disabled = state.settingsBusy;
      }
      for (const btn of $('fontScaleControl')?.querySelectorAll?.('button') || []) {
        btn.disabled = state.settingsBusy;
      }
      applyAppearance();
      renderUpdateSection();
    }

    function updatePreferences(data, { replacePath = false, replaceDays = false } = {}) {
      const previous = state.preferences;
      const oldPath = previous.exportDir || previous.defaultExportDir || '';
      const oldDays = previous.trashRetentionDays ?? 7;
      state.preferences = { ...previous, ...data };
      const path = $('exportDirInput');
      const days = $('trashRetentionInput');
      if (replacePath || path.value == null || path.value === oldPath) {
        path.value = state.preferences.exportDir || state.preferences.defaultExportDir || '';
      }
      if (replaceDays || days.value == null || Number(days.value) === oldDays) {
        days.value = state.preferences.trashRetentionDays ?? 7;
      }
      renderSettings();
    }

    async function refreshUpdateStatus({ check = false, force = false } = {}) {
      try {
        const endpoint = force ? '/api/check-update' : '/api/update-status';
        const status = await apiPost(endpoint, force ? {} : { check });
        state.updateStatus = status;
        renderUpdateSection();
        return status;
      } catch (err) {
        if (force) $('updateStatusFeedback').textContent = err.message || t('updateCheckErrorMsg');
        renderUpdateSection();
        return null;
      }
    }

    let appearanceFeedbackTimer = null;
    function flashAppearanceFeedback(text, duration = 1800) {
      clearTimeout(appearanceFeedbackTimer);
      $('appearanceStatus').textContent = text;
      if (text && duration > 0) {
        appearanceFeedbackTimer = setTimeout(() => {
          if ($('appearanceStatus').textContent === text) $('appearanceStatus').textContent = '';
        }, duration);
      }
    }

    async function saveAppearancePatch(patch) {
      const previous = {
        themeAccent: state.preferences.themeAccent ?? 'host',
        fontScale: state.preferences.fontScale ?? 'md',
      };
      state.preferences = { ...state.preferences, ...patch };
      applyAppearance(state.preferences);
      flashAppearanceFeedback(t('saving'), 0);
      try {
        const saved = await apiPost('/api/preferences', patch);
        updatePreferences(saved);
        flashAppearanceFeedback(t('settingsSaved'));
      } catch (err) {
        state.preferences = { ...state.preferences, ...previous };
        applyAppearance(state.preferences);
        flashAppearanceFeedback(err?.message || t('saveFailed'), 2800);
      }
    }

    $('themeAccentPicker').addEventListener('click', e => {
      const btn = e.target?.closest?.('[data-accent]');
      if (!btn || btn.disabled) return;
      const accent = btn.dataset.accent;
      if (VALID_THEME_ACCENTS.has(accent) && accent !== (state.preferences.themeAccent ?? 'host')) {
        return saveAppearancePatch({ themeAccent: accent });
      }
    });

    $('fontScaleControl').addEventListener('click', e => {
      const btn = e.target?.closest?.('[data-font-scale]');
      if (!btn || btn.disabled) return;
      const scale = btn.dataset.fontScale;
      if (VALID_FONT_SCALES.has(scale) && scale !== (state.preferences.fontScale ?? 'md')) {
        return saveAppearancePatch({ fontScale: scale });
      }
    });

    $('updateModeSelect').addEventListener('change', async () => {
      const mode = $('updateModeSelect').value;
      const previous = state.preferences.pluginUpdateMode ?? 'manual';
      if (mode === previous) return;
      $('updateStatusFeedback').textContent = t('saving');
      try {
        const saved = await apiPost('/api/preferences', { pluginUpdateMode: mode });
        updatePreferences(saved);
        $('updateStatusFeedback').textContent = t('settingsSaved');
        if (mode !== 'off' && !state.updateStatus?.checkedAtMs) {
          void refreshUpdateStatus({ check: true });
        }
      } catch (err) {
        $('updateModeSelect').value = previous;
        $('updateStatusFeedback').textContent = err?.message || t('saveFailed');
      }
    });

    $('checkUpdateBtn').addEventListener('click', async () => {
      if (state.updateBusy || state.settingsBusy) return;
      state.updateBusy = true;
      $('updateStatusFeedback').textContent = t('updateCheckingMsg');
      renderSettings();
      try {
        const status = await refreshUpdateStatus({ force: true });
        if (status && !status.lastError) {
          $('updateStatusFeedback').textContent = status.updateAvailable
            ? t('updateAvailableSub', status.latestVersion, t(status.installMode === 'git' ? 'updateModeGit' : 'updateModeArchive'))
            : t('updateUpToDateMsg', status.currentVersion);
        }
      } finally {
        state.updateBusy = false;
        renderSettings();
      }
    });

    $('applyUpdateBtn').addEventListener('click', async () => {
      if (state.updateBusy || state.settingsBusy) return;
      state.updateBusy = true;
      $('updateStatusFeedback').textContent = t('updateApplyingMsg');
      renderSettings();
      try {
        const res = await apiPost('/api/apply-update');
        $('updateStatusFeedback').textContent = res.message || (res.ok ? t('updateRestartingMsg') : t('updateCheckErrorMsg'));
        await refreshUpdateStatus({ check: false });
      } catch (err) {
        $('updateStatusFeedback').textContent = err?.message || t('updateCheckErrorMsg');
      } finally {
        state.updateBusy = false;
        renderSettings();
      }
    });

    async function runSettingsAction(status, action) {
      if (state.settingsBusy) return;
      state.settingsBusy = true;
      renderSettings();
      if (status) showDataStatus(status, '');
      try {
        await action();
      } catch (err) {
        if (status) showDataStatus(status, err.message);
      } finally {
        state.settingsBusy = false;
        renderSettings();
      }
    }

    function loadSettings() {
      return runSettingsAction(null, async () => {
        try {
          const prefs = await apiPost('/api/preferences');
          updatePreferences(prefs);
          showDataStatus('settingsLoadStatus', '');
          void refreshUpdateStatus({ check: prefs.pluginUpdateMode !== 'off' });
        } catch (err) {
          showDataStatus('settingsLoadStatus', [t('settingsLoadFailed'), err.message].join(t('noticeSeparator')));
        }
      });
    }

    function saveExportDir(exportDir) {
      return runSettingsAction('exportDirStatus', async () => {
        updatePreferences(await apiPost('/api/preferences', { exportDir }), { replacePath: true });
        showDataStatus('settingsLoadStatus', '');
        showDataStatus('exportDirStatus', t('settingsSaved'));
      });
    }

    $('exportDirForm').addEventListener('submit', event => {
      event.preventDefault();
      const exportDir = $('exportDirInput').value.trim();
      if (!/^(?:\/|[A-Za-z]:[\\/]|\\\\[^\\/]+[\\/][^\\/]+)/.test(exportDir)) {
        showDataStatus('exportDirStatus', t('exportPathInvalid'));
        return;

      return saveExportDir(exportDir);

    $('resetExportDirBtn').addEventListener('click', () => saveExportDir(null));
    $('pickExportDirBtn').addEventListener('click', () => runSettingsAction('exportDirStatus', async () => {
      const response = await apiPost('/api/pick-directory');
      if (response.unavailable) showDataStatus('exportDirStatus', t('pickerUnavailable'));
      else if (response.path) $('exportDirInput').value = response.path;
    }));

    $('trashRetentionForm').addEventListener('submit', event => {
      event.preventDefault();
      const trashRetentionDays = Number($('trashRetentionInput').value);
      if (!Number.isInteger(trashRetentionDays) || trashRetentionDays < 1 || trashRetentionDays > 365) {
        showDataStatus('trashSettingsStatus', t('retentionInvalid'));
        return;
      }
      return runSettingsAction('trashSettingsStatus', async () => {
        const saved = await apiPost('/api/preferences', { trashRetentionDays });
        updatePreferences(saved, { replaceDays: true });
        showDataStatus('settingsLoadStatus', '');
        showDataStatus('trashSettingsStatus', saved.dueCount > 0 ? t('trashDue', saved.dueCount) : t('settingsSaved'));
      });

    function confirmSweep(count) {
      const dialog = $('sweepDialog');
      $('sweepDescription').textContent = t('sweepConfirm', count);
      dialog.showModal();
      return new Promise(resolve => {
        const finish = confirmed => {
          dialog.onsubmit = null;
          dialog.oncancel = null;
          dialog.close();
          resolve(confirmed);
        };
        dialog.onsubmit = event => {
          event.preventDefault();
          finish(event.submitter?.value === 'confirm');
        };
        dialog.oncancel = event => {
          event.preventDefault();
          finish(false);
        };
      });
    }

    $('sweepTrashBtn').addEventListener('click', () => runSettingsAction('trashSettingsStatus', async () => {
      const latest = await apiPost('/api/preferences');
      updatePreferences(latest);
      const count = latest.trashSummary?.expiredCount;
      if (!Number.isInteger(count) || count < 0) throw new Error(t('settingsLoadFailed'));
      if (count === 0) {
        showDataStatus('trashSettingsStatus', t('nothingToSweep'));
        return;
      }
      if (!await confirmSweep(count)) return;
      let result;
      try {
        result = await apiPost('/api/sweep-trash', { maxExpiredCount: count, expectedRetentionDays: latest.trashRetentionDays });
      } catch (err) {
        // Reload the count if a retention or expiry change invalidated the confirmation.
        const current = await apiPost('/api/preferences').catch(() => null);
        if (current) updatePreferences(current);
        throw err;
      }
      const { purged = [], skipped = [], failed = [], warnings = [], trashSummary } = result;
      updatePreferences({ trashSummary });
      const details = failed.map(entry => entry.error).filter(Boolean);
      showDataStatus('trashSettingsStatus', [
        t('sweepOutcome', purged.length, skipped.length, failed.length), ...details, ...warnings,
      ].join(t('noticeSeparator')));
      if (purged.includes(state.selectedId)) clearPreview();
      state.snapshotId = null;
      await loadList({ refresh: true });
    }));

    async function initializePanel() {
      state.settingsBusy = true;
      applyLocale(defaultLocale);
      try {
        const saved = await apiPost('/api/preferences');
        updatePreferences(saved, { replacePath: true, replaceDays: true });
        if (Object.hasOwn(messages, saved.language)) applyLocale(saved.language);
      } catch (err) {
        showDataStatus('settingsLoadStatus', [t('settingsLoadFailed'), err.message].join(t('noticeSeparator')));
      } finally {
        state.settingsBusy = false;
        renderSettings();
      }
      await loadList();
      syncAllGliders();
      if (state.preferences.pluginUpdateMode !== 'off') {
        setTimeout(() => void refreshUpdateStatus({ check: true }), 1500);
      }
    }

    $('languageSelect').addEventListener('change', async () => {
      const select = $('languageSelect');
      const language = select.value;
      if (select.disabled || language === state.locale || !Object.hasOwn(messages, language)) return;
      showDataStatus('languageStatus', '');
      state.settingsBusy = true;
      renderSettings();
      try {
        const saved = await apiPost('/api/preferences', { language }, language);
        if (saved.language !== language) throw new Error();
        updatePreferences(saved);
        applyLocale(language);
        for (const id of ['settingsLoadStatus', 'exportDirStatus', 'trashSettingsStatus']) showDataStatus(id, '');
      } catch {
        select.value = state.locale;
        showDataStatus('languageStatus', t('languageFailed'));
        return;
      } finally {
        state.settingsBusy = false;
        renderSettings();
      }

      clearTimeout(searchTimer);
      showDataStatus('listWarning', '');
      $('listPane').innerHTML = `<div class="empty-state" role="status">${escapeHtml(t('loading'))}</div>`;
      const list = loadList();
      const preview = state.selectedId && openPreview(state.selectedId, { refreshLocale: true });
      await Promise.all([list, preview]);
    });

    function showSurface(surface) {
      state.surface = surface;
      const settings = surface === 'settings';
      $('libraryTools').hidden = settings;
      $('mainSplit').hidden = settings;
      $('settingsPane').hidden = !settings;
      $('libraryBtn').setAttribute('aria-pressed', !settings);
      $('settingsBtn').setAttribute('aria-pressed', settings);
      $('listWarning').hidden = settings || !$('listWarning').textContent;
      $('batchReport').hidden = settings || !state.deleteReport;
      if (settings) {
        statsSurfaceId++;
        pendingStats.clear();
        visibleStats.clear();
        statsObserver?.disconnect?.();
        syncAllGliders();
        return loadSettings();
      } else {
        if (state.listReady) renderList();
        if (state.previewMatchIndex < 0) stepPreviewMatch(1);
        syncAllGliders();
      }
    }

    $('libraryBtn').addEventListener('click', () => showSurface('library'));
    $('settingsBtn').addEventListener('click', () => showSurface('settings'));

    // Tabs & Filter events
    function switchTab(tab) {
      if (state.tab === tab) return;
      clearTimeout(searchTimer);
      state.tab = tab;
      clearPreview();
      resetFilters();
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === tab);
        if (b.dataset.tab === tab) b.setAttribute('aria-current', 'true');
        else b.removeAttribute('aria-current');
      });
      $('staleBar').classList.toggle('show', state.tab === 'stale');
      syncAllGliders();
      return loadList();
    }

      if (btn) return switchTab(btn.dataset.tab);

    $('viewTrashBtn').addEventListener('click', () => {

      $('libraryBtn').focus();
      return switchTab('trash');
    });

      const val = e.target.value;
      $('clearSearchBtn').classList.toggle('show', Boolean(val));
      state.query = val.trim();
      resetPreviewMatches();
      resetFilters();
      invalidateList();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadList();
        if (state.previewData) renderPreview();
      }, 200);

    $('clearSearchBtn').addEventListener('click', () => {

      $('clearSearchBtn').classList.remove('show');
      state.query = '';
      resetFilters();
      loadList();
      if (state.previewData) renderPreview();
    });

    for (const [id, key] of [['groupSelect', 'groupKey'], ['searchModeSelect', 'searchMode'],
      ['tagSelect', 'tag'], ['sortSelect', 'sort'], ['staleDaysSelect', 'staleDays']]) {
      $(id).addEventListener('change', e => {
        clearTimeout(searchTimer);
        state[key] = key === 'staleDays' ? Number(e.target.value) || 7 : e.target.value;

        const req = loadList();
        if (key === 'searchMode' && state.previewData) renderPreview();

    $('refreshBtn').addEventListener('click', async () => {

      } finally {
        btn.classList.remove('is-spinning');

    $('openExportDirBtn').addEventListener('click', async () => {

    $('batchExitBtn').addEventListener('click', () => {

    window.addEventListener('keydown', event => {

        || $('pvMatchNav').hidden || $('sweepDialog').open || state.pendingBatch

    // Inline native rename
    async function commitTitleEdit() {
      const input = $('pvTitleInput');
      if (input.style.display === 'none' || !state.previewData) return;
      const nextTitle = input.value.trim();
      const oldTitle = state.previewData.title;
      exitTitleEdit();
      if (nextTitle && nextTitle !== oldTitle) {
        await updateNativeAnnotation(state.previewData.id, { title: nextTitle }, 'renamed');
      }
    }
    $('pvRenameBtn').addEventListener('click', () => {
      if (!state.previewData) return;
      const input = $('pvTitleInput');
      if (input.style.display !== 'none') {
        commitTitleEdit();

      }
      $('pvTitle').style.display = 'none';

    function updateDeleteDialog() {
      const batch = state.pendingBatch;
      if (!batch) return;
      const purge = state.pendingDeleteAction === 'purge-trash';
      const label = t(purge ? 'trashPurge' : 'trashMove');
      $('deleteModalTitle').textContent = label;
      $('deleteConfirmBtn').textContent = label;
      $('deleteModalDesc').textContent = t(purge ? 'purgeConfirm' : 'trashConfirm', batch.length);
      const list = $('deleteTargets');
      list.innerHTML = '';
      for (const { id, title } of batch) {
        const entry = document.createElement('li');
        entry.textContent = title === id ? id : `${title} (${id})`;
        list.appendChild(entry);
      }
      list.hidden = false;
    }

    function renderDeleteReport() {
      const report = state.deleteReport;
      $('batchReport').hidden = !report || state.surface !== 'library';
      if (!report) return;
      const { action, succeeded, failed, warnings, titles } = report;
      $('batchSummary').textContent = `${trashActionLabel(action)} · ${t('trashResult', succeeded.length, failed.length)}`;
      const describe = id => titles.get(id) || id;
      $('batchDetails').textContent = [
        ...succeeded.map(describe),
        ...failed.map(row => t('failedItem', describe(row.id), row.error ?? row.reason)),
        ...warnings,
      ].join('\n');
    }

    function clearPreview() {
      ++previewRequestId;
      state.selectedId = null;
      state.previewData = null;
      resetPreviewMatches();
      setPreviewControlsReady(false);
      $('previewContent').style.display = 'none';
      $('previewEmpty').style.display = 'flex';
      $('mainSplit').classList.remove('show-preview');
    }

    function trashActionLabel(action) {
      const keys = { trash: 'trashMove', 'restore-trash': 'trashRestore', 'purge-trash': 'trashPurge' };
      return t(keys[action]);
    }

    function selectedBatch() {
      return [...state.checkedIds].map(id => ({ id, title: state.selectedTitles.get(id) || id }));
    }

    function confirmTrashAction(action, batch, fromPreview = false) {
      if (state.deleteBusy || state.archivePending || !batch.length) return;
      state.pendingDeleteId = fromPreview ? batch[0].id : null;
      state.pendingBatch = batch.map(({ id, title }) => ({ id, title: title || id }));
      state.pendingDeleteAction = action;
      updateDeleteDialog();
      deleteTrigger = document.activeElement;
      $('deleteModal').classList.add('show');
      $('deleteCancelBtn').focus?.();
    }

    async function performTrashAction(action, batch) {
      if (state.deleteBusy || state.archivePending || !batch.length) return;
      state.deleteBusy = true;
      const titles = new Map(batch.map(({ id, title }) => [id, title || id]));
      for (const id of titles.keys()) deletingIds.add(id);
      if (titles.has(state.selectedId)) {
        ++previewRequestId;
        state.previewData = null;
        setPreviewControlsReady(false);
      }
      updateBatchBar();
      try {
        const { succeeded = [], failed = [], warnings = [] } = await apiPost(`/api/${action}`, { conversationIds: [...titles.keys()] });
        for (const id of succeeded) {
          state.checkedIds.delete(id);
          state.selectedTitles.delete(id);
        }
        state.deleteReport = { action, succeeded, failed, warnings, titles };
        renderDeleteReport();
        $('batchReport').open = Boolean(failed.length || warnings.length);
        if (succeeded.includes(state.selectedId)) clearPreview();
      } catch (err) {
        showToast(() => t('archiveError', trashActionLabel(action), err.message));
      } finally {
        state.deleteBusy = false;
        for (const id of titles.keys()) deletingIds.delete(id);
        await loadList({ refresh: true });
        if (titles.has(state.selectedId)) await openPreview(state.selectedId, { refreshLocale: true });
        updateBatchBar();
      }
    }

    $('batchDeleteBtn').addEventListener('click', () => {
      if (!['archived', 'trash'].includes(state.tab) || !state.batchMode || !state.listReady || state.archivePending) return;
      confirmTrashAction(state.tab === 'trash' ? 'purge-trash' : 'trash', selectedBatch());
    });
    $('deleteModal').addEventListener('keydown', event => {
      if (event.key === 'Escape') closeDeleteModal();
      if (event.key === 'Tab') {
        event.preventDefault();
        const confirm = $('deleteConfirmBtn');
        const cancel = $('deleteCancelBtn');
        (document.activeElement === cancel ? confirm : cancel).focus();
      }
    });
    $('pvDeleteBtn').addEventListener('click', () => {
      const preview = state.previewData;
      if (!preview || preview.isRunning) return;
      confirmTrashAction(preview.trashedAt != null || state.tab === 'trash' ? 'purge-trash' : 'trash', [preview], true);
    });
    $('deleteCancelBtn').addEventListener('click', closeDeleteModal);
    $('deleteConfirmBtn').addEventListener('click', () => {
      const { pendingBatch: batch, pendingDeleteId: id, pendingDeleteAction: action } = state;
      closeDeleteModal();
      if (!batch || (id && id !== state.previewData?.id)) return;
      return performTrashAction(action, batch);
    });

    for (const [id, resolution] of [['useNativeTags', 'native'], ['useLocalTags', 'local']]) {
      $(id).addEventListener('click', async () => {
        const chat = state.previewData;
        if (chat?.tagConflict) await saveTags(chat.id, undefined, resolution);
      });
    }

    // Tags & note inputs
    $('tagInput').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !state.previewData) return;
      e.preventDefault();
      const val = e.target.value.trim().replace(/^#+/, '');
      if (!val) return;
      e.target.value = '';
      const nextTags = [...new Set([...(state.previewData.tags || []), val])];
      await saveTags(state.previewData.id, nextTags);
    });
    $('noteInput').addEventListener('blur', () => {
      if (state.previewData && $('noteInput').value.trim() !== (state.previewData.note || '')) {
        saveNote(state.previewData.id, $('noteInput').value);
      }
    });
    $('noteInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); $('noteInput').blur(); }
    });

    // Initial load & auto-refresh on focus
    initializePanel();
    window.addEventListener('resize', syncAllGliders);
    window.addEventListener('focus', () => {
      if (!$('languageSelect').disabled && state.surface === 'library') loadList({ refresh: true });
    });
  </script>
</body>
</html>
