<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会话管理</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --am-bg: var(--background, #f8fafc);
      --am-card: var(--card, #ffffff);
      --am-sidebar: var(--sidebar, #f1f5f9);
      --am-fg: var(--foreground, #0f172a);
      --am-muted: var(--muted-foreground, #64748b);
      --am-border: var(--border, #e2e8f0);
      --am-accent: var(--primary, #6366f1);
      --am-accent-fg: var(--primary-foreground, #ffffff);
      --am-hover: rgba(99, 102, 241, 0.10);
      --am-selected-bg: rgba(99, 102, 241, 0.15);
      --am-star: #f59e0b;
      --am-restore-bg: rgba(16, 185, 129, 0.14);
      --am-restore-fg: #10b981;
      --am-restore-border: rgba(16, 185, 129, 0.42);
      --am-archive-bg: rgba(245, 158, 11, 0.14);
      --am-archive-fg: #d97706;
      --am-archive-border: rgba(245, 158, 11, 0.44);
      --am-danger-bg: rgba(239, 68, 68, 0.12);
      --am-danger-fg: #ef4444;
      --am-danger-border: rgba(239, 68, 68, 0.40);
      --am-badge-archived-bg: rgba(129, 140, 248, 0.18);
      --am-badge-archived-fg: #818cf8;
      --am-badge-active-bg: rgba(16, 185, 129, 0.16);
      --am-badge-active-fg: #10b981;
      --am-badge-run-bg: rgba(34, 197, 94, 0.20);
      --am-badge-run-fg: #22c55e;
      --am-mark-bg: rgba(250, 204, 21, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--am-bg);
      color: var(--am-fg);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* Top Header */
    .header {
      flex-shrink: 0;
      padding: 10px 12px 8px;
      background: var(--am-card);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    .api-pill {
      font-size: 10.5px;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--am-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .tab-btn:hover {
      background: var(--am-hover);
      color: var(--am-fg);
    }
    .tab-btn.active {
      background: var(--am-accent);
      color: var(--am-accent-fg);
    }
    .tab-count {
      font-size: 11px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.16);
      font-variant-numeric: tabular-nums;
    }
    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.24);
      color: inherit;
    }

    /* Search & Filters */
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .search-box {
      flex: 1 1 180px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      padding: 6px 26px 6px 28px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--am-accent); }
    .search-icon {
      position: absolute;
      left: 8px;
      color: var(--am-muted);
      pointer-events: none;
      display: flex;
    }
    .search-clear {
      position: absolute;
      right: 5px;
      border: 0;
      background: transparent;
      color: var(--am-muted);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .search-clear.show { display: inline-block; }

    select.ctrl-select {
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
      max-width: 130px;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      color: var(--am-fg);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .btn:hover:not(:disabled) {
      border-color: var(--am-accent);
      color: var(--am-accent);
    }
    .btn-primary {
      background: var(--am-accent);
      border-color: var(--am-accent);
      color: var(--am-accent-fg);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      color: var(--am-accent-fg);
    }
    .btn-sm {
      padding: 3px 7px;
      font-size: 11.5px;
    }
    .btn-restore {
      background: var(--am-restore-bg);
      border-color: var(--am-restore-border);
      color: var(--am-restore-fg);
      font-weight: 500;
    }
    .btn-restore:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.24);
      border-color: var(--am-restore-fg);
      color: var(--am-restore-fg);
    }
    .btn-archive {
      background: var(--am-archive-bg);
      border-color: var(--am-archive-border);
      color: var(--am-archive-fg);
      font-weight: 500;
    }
    .btn-archive:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.24);
      border-color: var(--am-archive-fg);
      color: var(--am-archive-fg);
    }
    .btn-danger {
      background: var(--am-danger-bg);
      border-color: var(--am-danger-border);
      color: var(--am-danger-fg);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--am-danger-fg);
      color: var(--am-danger-fg);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Batch & Stale bars */
    .sub-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.22);
      font-size: 12px;
    }
    .sub-bar.show { display: flex; }
    .sub-bar-left, .sub-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Main Split Body */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .list-pane {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 10px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preview-pane {
      display: none;
      flex-direction: column;
      background: var(--am-card);
      border-left: 1px solid var(--am-border);
      min-width: 0;
      min-height: 0;
    }

    @media (min-width: 680px) {
      .list-pane {
        flex: 0 0 280px;
        max-width: 36%;
      }
      .preview-pane {
        display: flex;
        flex: 1;
      }
      .back-btn { display: none !important; }
    }

    @media (max-width: 679px) {
      .main.show-preview .list-pane { display: none; }
      .main.show-preview .preview-pane {
        display: flex;
        flex: 1;
        border-left: none;
      }
    }

    /* Conversation Card */
    .conv-card {
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .conv-card:hover { border-color: var(--am-accent); }
    .conv-card.selected {
      border-color: var(--am-accent);
      box-shadow: 0 0 0 1px var(--am-accent);
      background: var(--am-selected-bg);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .card-top-left {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .card-check {
      margin-top: 3px;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--am-accent);
      display: none;
    }
    .batch-mode .card-check { display: inline-block; }

    .card-title {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.38;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .icon-toggles {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 3px;
      color: var(--am-muted);
      opacity: 0.7;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .icon-btn:hover { transform: scale(1.15); opacity: 1; }
    .icon-btn.starred { color: var(--am-star); opacity: 1; }
    .icon-btn.pinned { color: var(--am-accent); opacity: 1; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--am-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }
    .pill-archived { background: var(--am-badge-archived-bg); color: var(--am-badge-archived-fg); }
    .pill-active { background: var(--am-badge-active-bg); color: var(--am-badge-active-fg); }
    .pill-run { background: var(--am-badge-run-bg); color: var(--am-badge-run-fg); }
    .pill-proj { background: rgba(128, 128, 128, 0.13); color: var(--am-fg); }
    .pill-tag { background: rgba(139, 92, 246, 0.14); color: var(--am-accent); }

    .run-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      animation: pulseDot 1.3s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .card-snippet {
      font-size: 11.5px;
      color: var(--am-muted);
      background: var(--am-bg);
      padding: 5px 8px;
      border-radius: 6px;
      border-left: 2px solid var(--am-accent);
      word-break: break-word;
    }

    .card-note {
      font-size: 11.5px;
      color: var(--am-muted);
      font-style: italic;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    mark {
      background: var(--am-mark-bg);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Preview Pane */
    .preview-header {
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--am-card);
    }

    .preview-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-title {
      font-weight: 600;
      font-size: 14px;
      word-break: break-word;
      flex: 1;
    }

    .title-edit-input {
      flex: 1;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--am-accent);
      background: var(--am-bg);
      color: var(--am-fg);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .meta-editor {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--am-bg);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      background: rgba(99, 102, 241, 0.14);
      color: var(--am-accent);
    }
    .tag-chip button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 1;
    }

    .inline-input {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--am-border);
      background: var(--am-card);
      color: var(--am-fg);
      font-size: 12px;
      outline: none;
    }
    .inline-input:focus { border-color: var(--am-accent); }

    .messages-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--am-bg);
    }

    .msg-block {
      flex-shrink: 0;
      border: 1px solid var(--am-border);
      border-radius: 10px;
      background: var(--am-card);
      overflow: hidden;
    }
    .msg-block.user { border-left: 3px solid var(--am-accent); }
    .msg-body-wrap {
      position: relative;
    }
    .msg-block.is-collapsed .msg-body {
      max-height: 320px;
      overflow: hidden;
    }
    .msg-fade {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      background: linear-gradient(to bottom, transparent, var(--am-card) 88%);
      pointer-events: none;
    }
    .msg-block.is-collapsed .msg-fade {
      display: block;
    }
    .msg-expand-btn {
      display: block;
      width: 100%;
      padding: 6px 12px;
      border: 0;
      border-top: 1px solid var(--am-border);
      background: rgba(128, 128, 128, 0.04);
      color: var(--am-accent);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s ease;
    }
    .msg-expand-btn:hover {
      background: var(--am-hover);
    }
    .msg-block.is-folded .msg-head {
      border-bottom: 0;
      cursor: pointer;
    }
    .msg-block.is-folded .msg-body-wrap,
    .msg-block.is-folded .msg-expand-btn {
      display: none !important;
    }
    .msg-head {
      padding: 6px 11px;
      background: rgba(128, 128, 128, 0.06);
      border-bottom: 1px solid var(--am-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--am-muted);
    }
    .msg-body {
      padding: 10px 12px;
      font-size: 12.8px;
      line-height: 1.62;
      word-break: break-word;
    }
    .msg-body.raw {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .msg-body pre {
      background: rgba(15, 23, 42, 0.08);
      padding: 8px 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      margin: 6px 0;
    }
    .msg-body code {
      background: rgba(128, 128, 128, 0.14);
      padding: 1px 4px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .msg-body pre code { background: transparent; padding: 0; }
    .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 { margin: 8px 0 4px; font-size: 13.5px; }
    .msg-body p { margin: 5px 0; }
    .msg-body ul, .msg-body ol { margin: 4px 0; padding-left: 20px; }
    .msg-body blockquote {
      margin: 6px 0;
      padding: 4px 10px;
      border-left: 3px solid var(--am-border);
      color: var(--am-muted);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 18px;
      color: var(--am-muted);
      gap: 8px;
    }

    /* Confirm Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 380px;
      background: var(--am-card);
      border: 1px solid var(--am-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--am-danger-fg); }
    .modal-desc { font-size: 12.5px; color: var(--am-muted); line-height: 1.5; word-break: break-word; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

    /* Toast */
    .toast {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 9999;
      background: #1e293b;
      color: #ffffff;
      padding: 9px 13px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 28px);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.18s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast-link {
      border: 0;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-top">
        <div class="brand">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="5" rx="1.5"/>
            <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
            <line x1="10" y1="13" x2="14" y2="13"/>
          </svg>
          <span>会话管理</span>
          <span class="api-pill" title="已接入 Antigravity v2.35.0 官方 ConversationService API">原生 API</span>
        </div>
        <div class="header-actions">
          <button id="batchToggleBtn" class="btn btn-sm" title="开启或关闭多选批量操作">☑ 批量</button>
          <button id="openExportDirBtn" class="btn btn-sm" title="打开 Markdown 导出文件夹">📂 导出目录</button>
          <button id="refreshBtn" class="btn btn-sm" title="刷新会话列表">↻ 刷新</button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="archived">📦 已归档 <span class="tab-count" id="cnt-archived">0</span></button>
        <button class="tab-btn" data-tab="active">💬 未归档 <span class="tab-count" id="cnt-active">0</span></button>
        <button class="tab-btn" data-tab="starred">⭐ 收藏 <span class="tab-count" id="cnt-starred">0</span></button>
        <button class="tab-btn" data-tab="stale">🧹 闲置 <span class="tab-count" id="cnt-stale">0</span></button>
        <button class="tab-btn" data-tab="all">📚 全部 <span class="tab-count" id="cnt-all">0</span></button>
      </div>

      <div class="filters-bar">
        <div class="search-box">
          <span class="search-icon">

  <!-- Double-confirm modal for permanent delete -->
  <div id="deleteModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">⚠️ 永久删除会话（不可撤销）</div>
      <div id="deleteModalDesc" class="modal-desc"></div>
      <div class="modal-actions">
        <button id="deleteCancelBtn" class="btn">取消</button>
        <button id="deleteConfirmBtn" class="btn btn-danger">确认永久删除</button>
      </div>

  </div>

  <div id="toast" class="toast">
    <span id="toastText"></span>
    <button id="toastAction" class="toast-link" style="display:none;"></button>
  </div>

  <script>
    const state = {
      tab: 'archived',
      query: '',
      project: '',
      tag: '',
      sort: 'updated',
      staleDays: 7,
      items: [],
      selectedId: null,
      previewData: null,
      rawMode: false,
      batchMode: false,
      checkedIds: new Set(),
      pendingDeleteId: null,
    };

    const MSG_COLLAPSE_THRESHOLD = 450;

    const $ = (id) => document.getElementById(id);
    let searchTimer = null;
    let toastTimer = null;

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlightText(htmlSafe, q) {
      if (!q) return htmlSafe;
      const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      try {
        return htmlSafe.replace(new RegExp(`(${escapedQ})`, 'gi'), '<mark>$1</mark>');
      } catch {
        return htmlSafe;
      }
    }

    function formatTime(ms, raw) {
      if (!ms) return raw ? raw.slice(0, 10) : '未知时间';
      const diffSec = Math.floor((Date.now() - ms) / 1000);
      if (diffSec < 60) return '刚刚';
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)} 分钟前`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} 小时前`;
      if (diffSec < 86400 * 14) return `${Math.floor(diffSec / 86400)} 天前`;
      const d = new Date(ms);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function showToast(msg, actionLabel, actionFn) {
      const toast = $('toast');
      $('toastText').textContent = msg;
      const btn = $('toastAction');
      if (actionLabel && actionFn) {
        btn.textContent = actionLabel;
        btn.style.display = 'inline-block';
        btn.onclick = () => {
          toast.classList.remove('show');
          actionFn();
        };
      } else {
        btn.style.display = 'none';
        btn.onclick = null;
      }
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 5200);
    }

    function renderMarkdown(md, q) {
      const codeBlocks = [];
      let text = String(md || '').replace(/\r\n/g, '\n');
      text = text.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${highlightText(escapeHtml(code.trimEnd()), q)}</code></pre>`);
        return `@@CODEBLOCK_${idx}@@`;
      });

      const lines = text.split('\n');
      const out = [];
      let inList = false;

      for (const line of lines) {
        if (/^@@CODEBLOCK_\d+@@$/.test(line.trim())) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(line.trim());
          continue;
        }
        const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (hMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          const lvl = hMatch[1].length;
          out.push(`<h${lvl}>${formatInline(hMatch[2], q)}</h${lvl}>`);
          continue;
        }
        const bqMatch = line.match(/^>\s?(.*)$/);
        if (bqMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<blockquote>${formatInline(bqMatch[1], q)}</blockquote>`);
          continue;
        }
        const liMatch = line.match(/^\s*[-*+]\s+(.+)$/);
        if (liMatch) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${formatInline(liMatch[1], q)}</li>`);
          continue;
        }
        if (inList) { out.push('</ul>'); inList = false; }
        if (!line.trim()) continue;
        if (/^---+$/.test(line.trim())) {
          out.push('<hr style="border:0;border-top:1px solid var(--am-border);margin:8px 0;"/>');
          continue;
        }
        out.push(`<p>${formatInline(line, q)}</p>`);
      }
      if (inList) out.push('</ul>');

      let html = out.join('\n');
      codeBlocks.forEach((blk, idx) => {
        html = html.replace(`@@CODEBLOCK_${idx}@@`, blk);
      });
      return html;
    }

    function formatInline(raw, q) {
      let s = escapeHtml(raw);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--am-accent);">$1</a>');
      return highlightText(s, q);
    }

    async function apiPost(path, body = {}) {
      const res = await window.sidecar.fetch(path, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function updateBatchBar() {
      $('listPane').classList.toggle('batch-mode', state.batchMode);
      $('batchBar').classList.toggle('show', state.batchMode);
      $('batchToggleBtn').classList.toggle('btn-primary', state.batchMode);
      const count = state.checkedIds.size;
      $('batchCountText').textContent = `已选 ${count} 条`;
      $('batchRestoreBtn').disabled = count === 0;
      $('batchArchiveBtn').disabled = count === 0;
    }

    async function loadList() {
      try {
        const data = await apiPost('/api/conversations', {
          tab: state.tab,
          query: state.query,
          project: state.project,
          tag: state.tag,
          sort: state.sort,
          staleDays: state.staleDays,
        });
        state.items = data.items || [];

        // Prune checked IDs not in current list
        const validIds = new Set(state.items.map((x) => x.id));
        for (const id of [...state.checkedIds]) {
          if (!validIds.has(id)) state.checkedIds.delete(id);
        }

        for (const key of ['archived', 'active', 'starred', 'stale', 'all']) {
          const el = $(`cnt-${key}`);
          if (el) el.textContent = String(data.counts?.[key] ?? 0);
        }

        const projSel = $('projectSelect');
        const curProj = state.project;
        projSel.innerHTML = '<option value="">全部项目</option>';
        for (const p of data.projects || []) {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          if (p === curProj) opt.selected = true;
          projSel.appendChild(opt);
        }

        const tagSel = $('tagSelect');
        const curTag = state.tag;
        tagSel.innerHTML = '<option value="">全部标签</option>';
        for (const t of data.allTags || []) {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = `#${t}`;
          if (t === curTag) opt.selected = true;
          tagSel.appendChild(opt);
        }

        $('archiveAllStaleBtn').disabled = state.tab !== 'stale' || state.items.length === 0;
        updateBatchBar();
        renderList();
      } catch (err) {
        $('listPane').innerHTML = `<div class="empty-state">加载失败: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderList() {
      const pane = $('listPane');
      if (!state.items.length) {
        const hint =
          state.query
            ? `没有找到包含「${escapeHtml(state.query)}」的会话`
            : state.tab === 'archived'
              ? '当前没有已归档会话'
              : state.tab === 'starred'
                ? '还没有收藏的会话，点击任意卡片右上角 ☆ 即可原生星标收藏'
                : state.tab === 'stale'
                  ? `暂无闲置超过 ${state.staleDays} 天的活跃会话`
                  : '暂无符合条件的会话';
        pane.innerHTML = `<div class="empty-state"><div style="font-size:24px;">📭</div><div>${hint}</div></div>`;
        return;
      }

      pane.innerHTML = '';
      for (const item of state.items) {
        const card = document.createElement('div');
        card.className = 'conv-card' + (item.id === state.selectedId ? ' selected' : '');

        const statusBadge = item.isRunning
          ? '<span class="pill pill-run"><span class="run-dot"></span>运行中</span>'
          : item.archived
            ? '<span class="pill pill-archived">已归档</span>'
            : '<span class="pill pill-active">活跃</span>';

        const tagsHtml = (item.tags || [])
          .map((t) => `<span class="pill pill-tag">#${escapeHtml(t)}</span>`)
          .join('');
        const snippetHtml = item.matchSnippet
          ? `<div class="card-snippet">${highlightText(escapeHtml(item.matchSnippet), state.query)}</div>`
          : '';
        const noteHtml = item.note
          ? `<div class="card-note">📝 ${highlightText(escapeHtml(item.note), state.query)}</div>`
          : '';

        const stepText = item.stepCount > 0 ? `<span>${item.stepCount} 步</span><span>·</span>` : '';
        const archiveActionBtn = item.archived
          ? '<button class="btn btn-sm btn-restore js-toggle-archive" title="直接通过官方 API 取消归档并恢复">♻️ 恢复</button>'
          : `<button class="btn btn-sm btn-archive js-toggle-archive" ${item.isRunning ? 'disabled title="运行中的会话暂不可归档"' : 'title="直接通过官方 API 归档此会话"'}>📦 归档</button>`;

        card.innerHTML = `
          <div class="card-top">
            <div class="card-top-left">
              <input type="checkbox" class="card-check" ${state.checkedIds.has(item.id) ? 'checked' : ''} />
              <div class="card-title">${highlightText(escapeHtml(item.title), state.query)}</div>
            </div>
            <div class="icon-toggles">
              <button class="icon-btn js-pin ${item.pinned ? 'pinned' : ''}" title="${item.pinned ? '取消置顶' : '原生置顶'}">📌</button>
              <button class="icon-btn js-star ${item.starred ? 'starred' : ''}" title="${item.starred ? '取消星标收藏' : '原生星标收藏'}">${item.starred ? '★' : '☆'}</button>
            </div>
          </div>
          <div class="card-meta">
            ${statusBadge}
            <span class="pill pill-proj">${escapeHtml(item.project)}</span>
            ${stepText}
            <span>${escapeHtml(formatTime(item.lastModifiedMs, item.lastModified))}</span>
            ${tagsHtml}
          </div>
          ${noteHtml}
          ${snippetHtml}
          <div class="card-actions">
            <button class="btn btn-sm js-open">↗ 打开对话</button>
            ${archiveActionBtn}
          </div>
        `;

        card.addEventListener('click', () => {
          if (state.batchMode) {
            if (state.checkedIds.has(item.id)) state.checkedIds.delete(item.id);
            else state.checkedIds.add(item.id);
            updateBatchBar();
            renderList();
            return;
          }
          openPreview(item.id);
        });

        card.querySelector('.card-check').addEventListener('click', (e) => {
          e.stopPropagation();
          if (e.target.checked) state.checkedIds.add(item.id);
          else state.checkedIds.delete(item.id);
          updateBatchBar();
        });

        card.querySelector('.js-pin').addEventListener('click', async (e) => {
          e.stopPropagation();
          await updateNativeAnnotation(item.id, { pinned: !item.pinned }, !item.pinned ? '已置顶会话' : '已取消置顶');
        });
        card.querySelector('.js-star').addEventListener('click', async (e) => {
          e.stopPropagation();
          await updateNativeAnnotation(item.id, { starred: !item.starred }, !item.starred ? '已星标收藏' : '已取消收藏');
        });
        card.querySelector('.js-open').addEventListener('click', (e) => {
          e.stopPropagation();
          openConversationInHost(item.id);
        });
        card.querySelector('.js-toggle-archive').addEventListener('click', async (e) => {
          e.stopPropagation();
          await setConversationsArchived([item.id], !item.archived, e.currentTarget);
        });

        pane.appendChild(card);
      }
    }

    function openConversationInHost(convId) {
      if (window.sidecar?.ui?.toggleConversation) {
        window.sidecar.ui.toggleConversation(convId);
        showToast('已在主窗口打开该会话');
      } else {
        showToast('当前环境不支持原生跳转');
      }
    }

    async function updateNativeAnnotation(convId, patch, successMsg) {
      try {
        await apiPost('/api/meta/update', { conversationId: convId, ...patch });
        if (state.previewData && state.previewData.id === convId) {
          Object.assign(state.previewData, patch);
          updatePreviewHeaderState();
        }
        if (successMsg) showToast(successMsg);
        await loadList();
      } catch (err) {
        showToast('更新失败: ' + err.message);
      }
    }

    // Instant native background archive/restore with Undo toast (zero window jumping!)
    async function setConversationsArchived(ids, wantArchived, triggerBtn) {
      if (!ids || !ids.length) return;
      const prevText = triggerBtn ? triggerBtn.textContent : '';
      if (triggerBtn) {
        triggerBtn.disabled = true;
        triggerBtn.textContent = wantArchived ? '归档中...' : '恢复中...';
      }
      try {
        const res = await apiPost('/api/set-archived', {
          conversationIds: ids,
          archived: wantArchived,
        });
        const doneIds = res.succeeded || [];
        if (doneIds.length === 0) {
          showToast(res.failed?.[0]?.error || '操作失败');
          return;
        }
        for (const id of doneIds) state.checkedIds.delete(id);
        if (state.previewData && doneIds.includes(state.previewData.id)) {
          state.previewData.archived = wantArchived;
          updatePreviewHeaderState();
        }
        const label =
          doneIds.length === 1
            ? (wantArchived ? '已归档该会话' : '已恢复到左侧会话列表')
            : (wantArchived ? `已批量归档 ${doneIds.length} 条会话` : `已批量恢复 ${doneIds.length} 条会话`);

        showToast(label, '撤回', async () => {
          await setConversationsArchived(doneIds, !wantArchived);
        });
        await loadList();
      } catch (err) {
        showToast((wantArchived ? '归档' : '恢复') + '失败: ' + err.message);
      } finally {
        if (triggerBtn && document.body.contains(triggerBtn)) {
          triggerBtn.disabled = false;
          triggerBtn.textContent = prevText;
        }
      }
    }

    async function openPreview(convId) {
      state.selectedId = convId;
      exitTitleEdit();
      $('mainSplit').classList.add('show-preview');
      $('previewEmpty').style.display = 'none';
      $('previewContent').style.display = 'flex';
      $('pvTitle').textContent = '加载中...';
      $('pvMessages').innerHTML = '<div class="empty-state">正在读取历史消息...</div>';
      $('pvCollapseAllBtn').disabled = true;
      $('pvScrollTopBtn').disabled = true;
      $('pvScrollBottomBtn').disabled = true;
      renderList();

      try {
        const data = await apiPost('/api/preview', { conversationId: convId });
        state.previewData = data;
        renderPreview();
      } catch (err) {
        $('pvMessages').innerHTML = `<div class="empty-state">预览加载失败: ${escapeHtml(err.message)}</div>`;
      }
    }

    function exitTitleEdit() {
      $('pvTitle').style.display = '';
      $('pvTitleInput').style.display = 'none';
      $('pvRenameBtn').textContent = '✏️ 重命名';
    }

    function updatePreviewHeaderState() {
      const d = state.previewData;
      if (!d) return;
      $('pvTitle').textContent = d.title;
      const archBtn = $('pvArchiveToggleBtn');
      archBtn.disabled = Boolean(d.isRunning);
      if (d.archived) {
        archBtn.textContent = '♻️ 恢复';
        archBtn.classList.add('btn-restore');
        archBtn.classList.remove('btn-archive');
      } else {
        archBtn.textContent = '📦 归档';
        archBtn.classList.remove('btn-restore');
        archBtn.classList.add('btn-archive');
      }
      $('pvRawBtn').textContent = state.rawMode ? '排版' : '原文';
      $('pvDeleteBtn').disabled = Boolean(d.isRunning);
      $('noteInput').value = d.note || '';

      const row = $('pvTagsRow');
      const input = $('tagInput');
      row.querySelectorAll('.tag-chip').forEach((n) => n.remove());
      for (const t of d.tags || []) {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `<span>#${escapeHtml(t)}</span><button type="button" title="移除标签">×</button>`;
        chip.querySelector('button').addEventListener('click', async () => {
          const nextTags = (d.tags || []).filter((x) => x !== t);
          await saveTags(d.id, nextTags);
        });
        row.insertBefore(chip, input);
      }
    }

    function syncCollapseAllBtn() {
      const box = $('pvMessages');
      const allBlocks = box.querySelectorAll('.msg-block');
      const longBlocks = box.querySelectorAll('.msg-block.is-long');
      const btn = $('pvCollapseAllBtn');
      const hasMsgs = allBlocks.length > 0;
      btn.disabled = !hasMsgs;
      $('pvScrollTopBtn').disabled = !hasMsgs;
      $('pvScrollBottomBtn').disabled = !hasMsgs;
      if (!hasMsgs) {
        btn.textContent = '⊞ 展开全部';
        return;
      }
      if (longBlocks.length > 0) {
        const hasCollapsed = Boolean(box.querySelector('.msg-block.is-collapsed, .msg-block.is-folded'));
        btn.textContent = hasCollapsed ? '⊞ 展开全部' : '⊟ 全部折叠';
        btn.title = hasCollapsed ? '展开全部超长消息' : '折叠全部超长消息';
      } else {
        const hasFolded = Boolean(box.querySelector('.msg-block.is-folded'));
        btn.textContent = hasFolded ? '⊞ 展开全部' : '⊟ 全部折叠';
        btn.title = hasFolded ? '展开全部消息' : '折叠全部消息正文';
      }
    }

    function toggleCollapseAllMessages() {
      const box = $('pvMessages');
      const allBlocks = [...box.querySelectorAll('.msg-block')];
      const longBlocks = [...box.querySelectorAll('.msg-block.is-long')];
      if (longBlocks.length > 0) {
        const shouldExpand = Boolean(box.querySelector('.msg-block.is-collapsed, .msg-block.is-folded'));
        for (const blk of allBlocks) blk.classList.remove('is-folded');
        for (const blk of longBlocks) {
          blk.classList.toggle('is-collapsed', !shouldExpand);
          const eb = blk.querySelector('.msg-expand-btn');
          if (eb) eb.textContent = shouldExpand ? '收起 ▴' : '展开全文 ▾';
        }
      } else if (allBlocks.length > 0) {
        const shouldExpand = Boolean(box.querySelector('.msg-block.is-folded'));
        for (const blk of allBlocks) {
          blk.classList.toggle('is-folded', !shouldExpand);
        }
      }
      syncCollapseAllBtn();
    }

    function renderPreview() {
      const d = state.previewData;
      if (!d) return;
      updatePreviewHeaderState();

      const box = $('pvMessages');
      if (!d.messages || !d.messages.length) {
        box.innerHTML = '<div class="empty-state">该会话暂无可预览的文本消息，请点击上方「打开对话」查看。</div>';
        syncCollapseAllBtn();
        return;
      }

      box.innerHTML = '';
      for (const m of d.messages) {
        const blk = document.createElement('div');
        blk.className = `msg-block ${m.role}`;
        const roleLabel = m.role === 'user' ? '👤 User' : '🤖 Assistant';
        const tsLabel = m.timestamp ? m.timestamp.replace('T', ' ').replace('Z', '') : '';
        const bodyHtml = state.rawMode
          ? highlightText(escapeHtml(m.content), state.query)
          : renderMarkdown(m.content, state.query);

        blk.innerHTML = `
          <div class="msg-head">
            <span>${roleLabel}</span>
            <span style="font-weight:400;">${escapeHtml(tsLabel)}</span>
          </div>
          <div class="msg-body-wrap">
            <div class="msg-body ${state.rawMode ? 'raw' : ''}">${bodyHtml}</div>
            <div class="msg-fade"></div>
          </div>
          <button type="button" class="msg-expand-btn" style="display:none;">展开全文 ▾</button>
        `;
        box.appendChild(blk);

        const bodyEl = blk.querySelector('.msg-body');
        const expandBtn = blk.querySelector('.msg-expand-btn');
        if (bodyEl.scrollHeight > MSG_COLLAPSE_THRESHOLD) {
          blk.classList.add('is-long', 'is-collapsed');
          expandBtn.style.display = 'block';
          expandBtn.textContent = '展开全文 ▾';
        }
        expandBtn.addEventListener('click', () => {
          const willCollapse = !blk.classList.contains('is-collapsed');
          blk.classList.toggle('is-collapsed', willCollapse);
          expandBtn.textContent = willCollapse ? '展开全文 ▾' : '收起 ▴';
          if (willCollapse && blk.getBoundingClientRect().top < box.getBoundingClientRect().top) {
            blk.scrollIntoView({ block: 'nearest' });
          }
          syncCollapseAllBtn();
        });
        blk.querySelector('.msg-head').addEventListener('click', () => {
          if (blk.classList.contains('is-folded')) {
            blk.classList.remove('is-folded');
            syncCollapseAllBtn();
          }
        });
      }
      box.scrollTop = 0;
      syncCollapseAllBtn();
    }

    async function saveTags(convId, tags) {
      try {
        const res = await apiPost('/api/meta/update', { conversationId: convId, tags });
        if (state.previewData && state.previewData.id === convId) {
          state.previewData.tags = res.meta.tags || [];
          updatePreviewHeaderState();
        }
        await loadList();
      } catch (err) {
        showToast('保存标签失败: ' + err.message);
      }
    }

    async function saveNote(convId, note) {
      try {
        const res = await apiPost('/api/meta/update', { conversationId: convId, note });
        if (state.previewData && state.previewData.id === convId) {
          state.previewData.note = res.meta.note || '';
        }
        await loadList();
      } catch (err) {
        showToast('保存备注失败: ' + err.message);
      }
    }

    async function exportConversationToFile(convId) {
      try {
        const res = await apiPost('/api/export', { conversationId: convId, saveToDisk: true });
        showToast(`已导出: ${res.filename}`, '定位文件', async () => {
          await apiPost('/api/reveal-file', { path: res.savedPath, isFile: true });
        });
      } catch (err) {
        showToast('导出失败: ' + err.message);
      }
    }

    // Tabs & Filter events
    $('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      state.tab = btn.dataset.tab;
      state.checkedIds.clear();
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
      $('staleBar').classList.toggle('show', state.tab === 'stale');
      loadList();
    });

    $('searchInput').addEventListener('input', (e) => {
      const val = e.target.value;
      $('clearSearchBtn').classList.toggle('show', Boolean(val));
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = val.trim();
        loadList();
        if (state.previewData) renderPreview();
      }, 200);
    });

    $('clearSearchBtn').addEventListener('click', () => {
      $('searchInput').value = '';
      $('clearSearchBtn').classList.remove('show');
      state.query = '';
      loadList();
      if (state.previewData) renderPreview();
    });

    $('projectSelect').addEventListener('change', (e) => { state.project = e.target.value; loadList(); });
    $('tagSelect').addEventListener('change', (e) => { state.tag = e.target.value; loadList(); });
    $('sortSelect').addEventListener('change', (e) => { state.sort = e.target.value; loadList(); });
    $('staleDaysSelect').addEventListener('change', (e) => { state.staleDays = Number(e.target.value) || 7; loadList(); });

    $('refreshBtn').addEventListener('click', () => {
      loadList();
      if (state.selectedId) openPreview(state.selectedId);
      showToast('已刷新会话列表');
    });

    $('openExportDirBtn').addEventListener('click', async () => {
      try {
        await apiPost('/api/reveal-file', { path: '', isFile: false });
      } catch {
        showToast('尚未导出过文件，请先导出任意会话');
      }
    });

    // Batch actions
    $('batchToggleBtn').addEventListener('click', () => {
      state.batchMode = !state.batchMode;
      if (!state.batchMode) state.checkedIds.clear();
      updateBatchBar();
      renderList();
    });
    $('batchExitBtn').addEventListener('click', () => {
      state.batchMode = false;
      state.checkedIds.clear();
      updateBatchBar();
      renderList();
    });
    $('selectAllBtn').addEventListener('click', () => {
      const eligible = state.items.filter((i) => !i.isRunning);
      if (state.checkedIds.size === eligible.length) {
        state.checkedIds.clear();
      } else {
        for (const i of eligible) state.checkedIds.add(i.id);
      }
      updateBatchBar();
      renderList();
    });
    $('batchRestoreBtn').addEventListener('click', (e) => {
      setConversationsArchived([...state.checkedIds], false, e.currentTarget);
    });
    $('batchArchiveBtn').addEventListener('click', (e) => {
      setConversationsArchived([...state.checkedIds], true, e.currentTarget);
    });
    $('archiveAllStaleBtn').addEventListener('click', (e) => {
      const ids = state.items.filter((i) => !i.isRunning && !i.archived).map((i) => i.id);
      if (!ids.length) return;
      setConversationsArchived(ids, true, e.currentTarget);
    });

    // Preview toolbar events
    $('backBtn').addEventListener('click', () => $('mainSplit').classList.remove('show-preview'));
    $('pvOpenBtn').addEventListener('click', () => {
      if (state.previewData) openConversationInHost(state.previewData.id);
    });
    $('pvArchiveToggleBtn').addEventListener('click', (e) => {
      if (state.previewData) setConversationsArchived([state.previewData.id], !state.previewData.archived, e.currentTarget);
    });
    $('pvExportFileBtn').addEventListener('click', () => {
      if (state.previewData) exportConversationToFile(state.previewData.id);
    });
    $('pvRawBtn').addEventListener('click', () => {
      state.rawMode = !state.rawMode;
      renderPreview();
    });
    $('pvCollapseAllBtn').addEventListener('click', toggleCollapseAllMessages);
    $('pvScrollTopBtn').addEventListener('click', () => {
      $('pvMessages').scrollTo({ top: 0, behavior: 'smooth' });
    });
    $('pvScrollBottomBtn').addEventListener('click', () => {
      const box = $('pvMessages');
      box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
    });

    // Inline native rename
    async function commitTitleEdit() {
      const input = $('pvTitleInput');
      if (input.style.display === 'none' || !state.previewData) return;
      const nextTitle = input.value.trim();
      const oldTitle = state.previewData.title;
      exitTitleEdit();
      if (nextTitle && nextTitle !== oldTitle) {
        await updateNativeAnnotation(state.previewData.id, { title: nextTitle }, '已重命名会话');
      }
    }
    $('pvRenameBtn').addEventListener('click', () => {
      if (!state.previewData) return;
      const input = $('pvTitleInput');
      if (input.style.display !== 'none') {
        commitTitleEdit();
        return;
      }
      $('pvTitle').style.display = 'none';
      input.style.display = 'block';
      input.value = state.previewData.title || '';
      $('pvRenameBtn').textContent = '✓ 保存';
      input.focus();
      input.select();
    });
    $('pvTitleInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commitTitleEdit(); }
      if (e.key === 'Escape') { e.preventDefault(); exitTitleEdit(); }
    });

    // Safe delete modal
    $('pvDeleteBtn').addEventListener('click', () => {
      if (!state.previewData || state.previewData.isRunning) return;
      state.pendingDeleteId = state.previewData.id;
      $('deleteModalDesc').textContent = `确定要永久删除会话「${state.previewData.title}」吗？该操作会彻底删除对话记录且无法恢复（若只想隐藏，建议点击「归档」）。`;
      $('deleteModal').classList.add('show');
    });
    $('deleteCancelBtn').addEventListener('click', () => {
      state.pendingDeleteId = null;
      $('deleteModal').classList.remove('show');
    });
    $('deleteConfirmBtn').addEventListener('click', async () => {
      const id = state.pendingDeleteId;
      $('deleteModal').classList.remove('show');
      state.pendingDeleteId = null;
      if (!id) return;
      try {
        await apiPost('/api/delete', { conversationId: id });
        if (state.selectedId === id) {
          state.selectedId = null;
          state.previewData = null;
          $('previewContent').style.display = 'none';
          $('previewEmpty').style.display = 'flex';
          $('mainSplit').classList.remove('show-preview');
        }
        showToast('已永久删除该会话');
        await loadList();
      } catch (err) {
        showToast('删除失败: ' + err.message);
      }
    });

    // Tags & note inputs
    $('tagInput').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !state.previewData) return;
      e.preventDefault();
      const val = e.target.value.trim().replace(/^#+/, '');
      if (!val) return;
      e.target.value = '';
      const nextTags = [...new Set([...(state.previewData.tags || []), val])];
      await saveTags(state.previewData.id, nextTags);
    });
    $('noteInput').addEventListener('blur', () => {
      if (state.previewData && $('noteInput').value.trim() !== (state.previewData.note || '')) {
        saveNote(state.previewData.id, $('noteInput').value);
      }
    });
    $('noteInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); $('noteInput').blur(); }
    });

    // Initial load & auto-refresh on focus
    loadList();
    window.addEventListener('focus', () => loadList());
  </script>
</body>
</html>
